<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080f" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Ivandro Silva — Hub Financeiro</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_dc1z0cLy0cqrtQhy52AuRnFosCtKANQ",
      authDomain: "kambio-business.firebaseapp.com",
      projectId: "kambio-business",
      storageBucket: "kambio-business.firebasestorage.app",
      messagingSenderId: "830662712719",
      appId: "1:830662712719:web:abc695b03a706217ebbffa"
    };

    // ── COLLECTIONS ────────────────────────────────────────────────────
    const COLS = ["hub_income", "hub_expenses", "hub_custody", "hub_taxi", "hub_imports", "hub_taxi_costs", "hub_loans", "hub_investments", "hub_deposits", "hub_obligations", "sales", "lots", "wallets", "accounts", "hub_notes", "clients", "settings"];
    const DEFAULT_SPLIT = { reinvest: 0.6, salary: 0.3, savings: 0.1 };

    let app, db_fire, auth, currentUser = null;
    let db = { hub_income: [], hub_expenses: [], hub_custody: [], hub_taxi: [], hub_imports: [], hub_taxi_costs: [], hub_loans: [], hub_investments: [], hub_deposits: [], hub_obligations: [], sales: [], lots: [], wallets: [], accounts: [], hub_notes: [], clients: [], settings: [] };
    let _busy = 0;
    function busy(on) {
      _busy = Math.max(0, _busy + (on ? 1 : -1));
      const overlay = document.getElementById("busy-overlay");
      if (overlay) overlay.style.display = _busy > 0 ? "flex" : "none";
    }

    // ── FIREBASE INIT ──────────────────────────────────────────────────
    async function initAppAndAuth() {
      app = initializeApp(firebaseConfig, "hub");
      auth = getAuth(app);
      onAuthStateChanged(auth, (user) => {
        if (user) { currentUser = user; initFirebase(); }
        else { currentUser = null; renderLogin(); }
      });
    }

    async function initFirebase() {
      try {
        db_fire = initializeFirestore(app, {
          localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        setStatus("connecting");
        COLS.forEach(col => {
          onSnapshot(collection(db_fire, col), snap => {
            db[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
            setStatus("online");
          }, () => setStatus("offline"));
        });
      } catch (e) {
        console.error(e);
        setStatus("error");
      }
    }

    async function saveDoc(col, item) {
      const id = item.id ? String(item.id) : String(Date.now());
      const data = { ...item, id };
      busy(true);
      try { await setDoc(doc(db_fire, col, id), data); } finally { busy(false); }
      return id;
    }
    async function delDoc(col, id) {
      busy(true);
      try { await deleteDoc(doc(db_fire, col, String(id))); } finally { busy(false); }
    }

    async function bulkSave(updates) {
      busy(true);
      try { for (const u of updates) await saveDoc(u.col, u.item); } finally { busy(false); }
    }

    function setStatus(s) {
      const el = document.getElementById("hub-status");
      if (!el) return;
      const map = { online: ["🟢", "#50c878"], offline: ["🟡", "#c9a84c"], connecting: ["🔵", "#7eb8f7"], error: ["🔴", "#ff5050"] };
      const [icon, color] = map[s] || map.error;
      el.innerHTML = `<span style="font-size:9px;color:${color}">${icon} ${s.toUpperCase()}</span>`;
    }

    function kambioLink() {
      // Se estiver a correr localmente (file:// ou localhost), aponta para o index.html local
      if (location.protocol === "file:" || location.hostname === "localhost") {
        return "../kambio/index.html"; // ajusta este caminho conforme a tua estrutura de pastas
      }
      return "https://kambio-business.web.app";
    }

    // ── FORMATTERS ─────────────────────────────────────────────────────
    const fKz = v => `${Number(v || 0).toLocaleString("pt-AO", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Kz`;
    const fUSD = v => `$${Number(v || 0).toFixed(2)}`;
    const FIAT_ASSETS = ["EUR", "USD", "GBP"];
    const fAsset = (v, asset = "Kz") => asset === "Kz" ? fKz(v) : `${Number(v || 0).toFixed(FIAT_ASSETS.includes(asset) ? 2 : 4)} ${asset}`;
    const fDate = d => d ? new Date(d).toLocaleDateString("pt-AO") : "—";
    const today = () => new Date().toISOString().split("T")[0];
    const uid = () => Date.now();
    function currentSplit(business = "global", dateStr) {
      const configured = db.settings?.find(item => item.id === "profit-splits") || db.settings?.find(item => item.id === "profit-split");
      let selected = configured?.[business] || configured?.global || (configured?.id === "profit-split" ? configured : null);
      const history = db.settings?.find(item => item.id === "profit-split-history")?.history || [];
      if (dateStr) {
        const applicable = history.filter(h => (!h.business || h.business === business) && (!h.effectiveFrom || h.effectiveFrom <= dateStr)).sort((a, b) => String(a.effectiveFrom || "").localeCompare(String(b.effectiveFrom || "")));
        const last = applicable[applicable.length - 1];
        if (last) selected = last;
      }
      return selected ? { ...DEFAULT_SPLIT, ...selected } : DEFAULT_SPLIT;
    }
    function splitHistory() { return db.settings?.find(item => item.id === "profit-split-history")?.history || []; }

    const INCOME_CATS = ["Salário", "Serviços Extras", "Importação", "Táxi", "Outro"];
    const EXPENSE_CATS = ["Alimentação", "Transporte", "Telecomunicações", "Lazer", "Vestuário", "Cota Juventude", "Investimento", "Outro"];

    function inPeriod(dateStr, period) {
      if (!dateStr) return false;
      const dt = new Date(dateStr);
      const now = new Date();
      if (period === "today") return dateStr === today();
      if (period === "week") { const ws = new Date(now); ws.setDate(now.getDate() - now.getDay()); return dt >= ws; }
      if (period === "month") return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
      if (period === "year") return dt.getFullYear() === now.getFullYear();
      return true; // "all"
    }

    // ── PAGES ──────────────────────────────────────────────────────────
    const PAGES = [
      { id: "resumo", label: "Resumo Geral", icon: "▣" },
      { id: "pessoal", label: "Finanças", icon: "◆" },
      { id: "taxi", label: "Táxi", icon: "◉" },
      { id: "importacao", label: "Importação", icon: "◈" },
      { id: "custodia", label: "Custódia", icon: "🔒" },
      { id: "investimentos", label: "Investimentos", icon: "⬢" },
      { id: "aplicacoes", label: "Aplicações", icon: "⏳" },
      { id: "emprestimos", label: "Empréstimos", icon: "💵" },
      { id: "insights", label: "Inteligência", icon: "✦" },
      { id: "calculadora", label: "Calculadora", icon: "⊕" },
      { id: "definicoes", label: "Definições", icon: "⚙" },
    ];

    let page = "resumo";
    let modal = null;
    let modalState = null;
    let resumoPeriod = "month";
    window.setResumoPeriod = function (p) { resumoPeriod = p; render(); };

    function renderLogin(error = "") {
      document.getElementById("app").innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-name" style="text-align:center">KÂMBIO</div>
      <div class="brand-sub" style="text-align:center;margin-bottom:22px">BUSINESS · PRO</div>
      ${error ? `<div style="color:#ff5050;font-size:12px;margin-bottom:12px;text-align:center">${error}</div>` : ""}
      <div class="field" style="margin-bottom:12px"><label>Email</label><input type="email" id="login-email"/></div>
      <div class="field" style="margin-bottom:20px"><label>Palavra-passe</label>
        <input type="password" id="login-pass" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn-primary" style="width:100%" onclick="doLogin()">ENTRAR</button>
    </div>
  </div>`;
    }

    window.doLogin = async function () {
      const email = document.getElementById("login-email")?.value?.trim();
      const pass = document.getElementById("login-pass")?.value;
      if (!email || !pass) return renderLogin("Preenche email e palavra-passe.");
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch { renderLogin("Email ou palavra-passe incorretos."); }
    };

    window.doLogout = async function () { await signOut(auth); };

    function withFocusPreserved(updateFn) {
      const active = document.activeElement;
      const id = active && active.id;
      const isFormControl = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
      const formState = isFormControl
        ? [...document.querySelectorAll("input[id], select[id], textarea[id]")].reduce((state, el) => {
          state[el.id] = { value: el.value, checked: el.checked };
          return state;
        }, {})
        : null;
      let start = null, end = null;
      try {
        if (active && typeof active.selectionStart === "number") {
          start = active.selectionStart;
          end = active.selectionEnd;
        }
      } catch { }
      updateFn();
      if (formState) {
        Object.entries(formState).forEach(([fieldId, state]) => {
          const el = document.getElementById(fieldId);
          if (!el) return;
          el.value = state.value;
          if (typeof state.checked === "boolean") el.checked = state.checked;
        });
      }
      if (id) {
        const el = document.getElementById(id);
        if (el) {
          el.focus();
          if (start !== null && el.setSelectionRange) { try { el.setSelectionRange(start, end); } catch { } }
        }
      }
    }

    function render() {
      const el = document.getElementById("app");
      if (!el) return;
      withFocusPreserved(() => {
        el.innerHTML = layout();
        attachAll();
      });
      if (_busy > 0) { const overlay = document.getElementById("busy-overlay"); if (overlay) overlay.style.display = "flex"; }
    }

    function layout() {
      return `
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="bname">IVANDRO</span>
          <span class="bsub">HUB FINANCEIRO</span>
        </div>
        <nav>${PAGES.map(p => `
          <button class="nav${page === p.id ? " act" : ""}" onclick="go('${p.id}')">
            <span style="font-size:14px;width:20px">${p.icon}</span><span>${p.label}</span>
          </button>`).join("")}
        </nav>
        <div class="sidebar-foot">
          <div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">META 2026</div>
          ${goalBar()}
          <div id="hub-status" style="margin-top:8px"></div>
          <button class="btn-ghost" style="width:100%;margin-top:10px;font-size:10px" onclick="doLogout()">SAIR ⏻</button>
        </div>
      </aside>
      <div class="veil" id="veil" onclick="closeMenu()"></div>
      <div class="main">
        <header class="hdr">
          <button class="ham" onclick="toggleMenu()">☰</button>
          <div>
            <div class="ptitle">${PAGES.find(p => p.id === page)?.label}</div>
            <div class="pdate">${new Date().toLocaleDateString("pt-AO", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
          </div>
          <a href="${kambioLink()}" style="margin-left:auto;font-size:10px;color:#c9a84c;text-decoration:none;letter-spacing:1px;border:1px solid #c9a84c33;padding:6px 12px;border-radius:2px">↗ KÂMBIO</a>
        </header>
        <div class="body">
          ${buildPage()}
        </div>
      </div>
      <div id="busy-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(8,8,15,.7);align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="width:34px;height:34px;border:3px solid #c9a84c33;border-top-color:#c9a84c;border-radius:50%;animation:spin 0.8s linear infinite"></div><div style="color:#c9a84c;font-size:11px;letter-spacing:2px">A GRAVAR...</div></div>`;
    }

    function go(p) { page = p; closeMenu(); render(); }
    function toggleMenu() { document.getElementById("sidebar")?.classList.toggle("open"); document.getElementById("veil")?.classList.toggle("show"); }
    function closeMenu() { document.getElementById("sidebar")?.classList.remove("open"); document.getElementById("veil")?.classList.remove("show"); }
    window.go = go; window.toggleMenu = toggleMenu; window.closeMenu = closeMenu;

    // ── GOAL BAR ───────────────────────────────────────────────────────
    function goalBar() {
      const meta = 2000000;
      const total = patrimonio();
      const pct = Math.min(100, (total / meta) * 100).toFixed(1);
      return `
      <div style="font-size:11px;color:#c9a84c;font-weight:700;margin-bottom:4px">${fKz(total)} / ${fKz(meta)}</div>
      <div style="background:#1a1a2e;border-radius:2px;height:6px;overflow:hidden">
        <div style="background:linear-gradient(90deg,#c9a84c,#50c878);width:${pct}%;height:100%;transition:width .5s"></div>
      </div>
      <div style="font-size:10px;color:#555;margin-top:3px">${pct}% da meta</div>`;
    }

    function avgBuyRate(asset) {
      const relevant = db.lots.filter(l => (l.asset || "USDT") === asset && Number(l.remaining || 0) > 0);
      const totalQty = relevant.reduce((s, l) => s + Number(l.remaining || 0), 0);
      if (!totalQty) return 0;
      const totalKz = relevant.reduce((s, l) => s + Number(l.remaining || 0) * Number(l.rateKz || 0), 0);
      return totalKz / totalQty;
    }

    function kbCapitalKz() {
      const walletsKz = db.wallets.reduce((s, w) => {
        const asset = w.asset || "USDT";
        const walletStock = db.lots.filter(l => String(l.walletId) === String(w.id) && (l.asset || "USDT") === asset && Number(l.remaining || 0) > 0)
          .reduce((total, lot) => total + Number(lot.remaining || 0), 0);
        return s + walletStock * avgBuyRate(asset);
      }, 0);
      const accountsKz = db.accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
      return walletsKz + accountsKz;
    }

    // ── PATRIMÔNIO TOTAL (excluindo custódia e sem dupla contagem) ─────
    function kbWalletsKz() {
      return db.wallets.reduce((s, w) => {
        const asset = w.asset || "USDT";
        const walletStock = db.lots.filter(l => String(l.walletId) === String(w.id) && (l.asset || "USDT") === asset && Number(l.remaining || 0) > 0)
          .reduce((total, lot) => total + Number(lot.remaining || 0), 0);
        return s + walletStock * avgBuyRate(asset);
      }, 0);
    }
    function kbAccountsKz(type = null) {
      return db.accounts.filter(a => !type || a.type === type).reduce((s, a) => s + Number(a.balance || 0), 0);
    }
    function isTaxiInvestment(cost) {
      return cost.costType === "investimento" || (!cost.costType && cost.category === "Compra do Carro");
    }
    function taxiInvestmentTotal() {
      return db.hub_taxi_costs.filter(isTaxiInvestment).reduce((s, x) => s + Number(x.amount || 0), 0);
    }
    function taxiOperatingTotal() {
      return db.hub_taxi_costs.filter(x => !isTaxiInvestment(x)).reduce((s, x) => s + Number(x.amount || 0), 0);
    }
    function taxiCarValue() {
      return Number((db.settings || []).find(s => s.id === "taxi-car-value")?.value || 0);
    }
    function importStockValue() {
      return db.hub_imports.filter(i => i.status !== "vendido").reduce((s, i) => s + Number(i.totalCostKz || 0), 0);
    }
    function importProfitTotal() {
      return db.hub_imports.filter(i => i.status === "vendido").reduce((s, i) => s + Number(i.profitKz || 0), 0);
    }
    function investmentsValue() {
      return (db.hub_investments || []).filter(x => x.status !== "fechado").reduce((s, x) => s + Number(x.currentValue ?? x.myCapital ?? 0), 0);
    }
    function depositsValue() {
      return (db.hub_deposits || []).filter(x => !x.status || x.status === "Em aplicação").reduce((s, x) => s + Number(x.amount || 0), 0);
    }
    function patrimonio() {
      const taxiIn = db.hub_taxi.reduce((s, x) => s + Number(x.amount || 0), 0);
      // Nota: entradas/saídas pessoais já movimentam o saldo das contas — não são somadas aqui (evitar dupla contagem).
      return kbWalletsKz() + kbAccountsKz() + taxiCarValue() + (taxiIn - taxiOperatingTotal()) + importProfitTotal() + importStockValue() + investmentsValue() + depositsValue();
    }
    function obligationsValue() {
      return (db.hub_obligations || []).filter(x => !x.status || x.status === "Em dívida").reduce((s, x) => s + Number(x.amount || 0), 0);
    }
    function netWorth() {
      return patrimonio() - obligationsValue();
    }

    // ══════════════════════════════════════════════════════════════════
    //  PAGES
    // ══════════════════════════════════════════════════════════════════
    function buildPage() {
      switch (page) {
        case "resumo": return pageResumo();
        case "pessoal": return pagePessoal();
        case "taxi": return pageTaxi();
        case "importacao": return pageImportacao();
        case "custodia": return pageCustodia();
        case "investimentos": return pageInvestimentos();
        case "aplicacoes": return pageAplicacoes();
        case "emprestimos": return pageEmprestimos();
        case "insights": return pageInsights();
        case "calculadora": return pageCalculadora();
        case "definicoes": return pageDefinicoes();
        default: return "";
      }
    }

    // ── RESUMO GERAL ───────────────────────────────────────────────────
    function pageResumo() {
      const meta = 2000000;
      const total = patrimonio();
      const liquid = netWorth();
      const pct = Math.min(100, (total / meta) * 100).toFixed(1);
      const falta = Math.max(0, meta - total);

      const income = db.hub_income.reduce((s, x) => s + Number(x.amount || 0), 0);
      const expenses = db.hub_expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
      const taxiIn = db.hub_taxi.reduce((s, x) => s + Number(x.amount || 0), 0);
      const custodia = db.hub_custody.reduce((s, x) => s + Number(x.amount || 0), 0);
      const custodiaDevolvido = db.hub_custody.filter(x => x.returned).reduce((s, x) => s + Number(x.amount || 0), 0);
      const custodiaAtiva = custodia - custodiaDevolvido;

      const RP = [{ id: "today", label: "HOJE" }, { id: "week", label: "SEMANA" }, { id: "month", label: "MÊS" }, { id: "year", label: "ANO" }, { id: "all", label: "TUDO" }];
       const kambioProfitP = db.sales.filter(s => (!s.pendingPayment || s.pendingPaid) && inPeriod(s.date, resumoPeriod)).reduce((s, x) => s + Number(x.totalProfit || 0), 0);
      const taxiInP = db.hub_taxi.filter(x => inPeriod(x.date, resumoPeriod)).reduce((s, x) => s + Number(x.amount || 0), 0);
      const taxiCostP = db.hub_taxi_costs.filter(x => inPeriod(x.date, resumoPeriod)).reduce((s, x) => s + Number(x.amount || 0), 0);
      const taxiLiquidP = taxiInP - taxiCostP;
      const importProfitP = db.hub_imports.filter(i => i.status === "vendido" && inPeriod(i.orderDate, resumoPeriod)).reduce((s, i) => s + Number(i.profitKz || 0), 0);

      return `
      <!-- META -->
      <div class="card" style="margin-bottom:20px;border-color:#c9a84c33;background:linear-gradient(135deg,#0f0f1a,#111120)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div>
            <div style="font-size:10px;color:#c9a84c;letter-spacing:3px;margin-bottom:6px">META PATRIMONIAL 2026</div>
            <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#e8e4d9">${fKz(total)}</div>
            <div style="font-size:12px;color:#50c878;margin-top:4px">Património Líquido: <span style="font-weight:700">${fKz(liquid)}</span>${obligationsValue() > 0 ? ` · Obrigações: <span style="color:#ff7850">${fKz(obligationsValue())}</span>` : ""}</div>
            <div style="font-size:12px;color:#555;margin-top:4px">Faltam <span style="color:#c9a84c">${fKz(falta)}</span> para os 2.000.000 Kz</div>
          </div>
          <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:${pct >= 100 ? "#50c878" : "#c9a84c"}">${pct}%</div>
        </div>
        <div style="background:#1a1a2e;border-radius:4px;height:10px;overflow:hidden">
          <div style="background:linear-gradient(90deg,#c9a84c,#50c878);width:${pct}%;height:100%;transition:width 1s;border-radius:4px"></div>
        </div>
      </div>

      <div class="grid4" style="margin-bottom:20px">
        ${sc("Fluxo Pessoal (total)", fKz(income - expenses), income - expenses >= 0 ? "#50c878" : "#ff5050", "◆")}
        ${sc("Táxi (líquido)", fKz(taxiIn - taxiOperatingTotal()), "#7eb8f7", "◉")}
        ${sc("Importação (lucro)", fKz(importProfitTotal()), "#c084fc", "◈")}
        ${sc("Em Custódia", fKz(custodiaAtiva), "#ff7850", "🔒")}
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="sec-title">Decomposição do Património</div>
        <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin:10px 0 6px">DINHEIRO DISPONÍVEL</div>
        <div class="row"><span>Carteiras cripto (ao câmbio médio de compra)</span><span style="color:#7eb8f7">${fKz(kbWalletsKz())}</span></div>
        <div class="row"><span>Contas de negócio</span><span style="color:#7eb8f7">${fKz(kbAccountsKz("negocio"))}</span></div>
        <div class="row"><span>Contas pessoais</span><span style="color:#c9a84c">${fKz(kbAccountsKz("pessoal"))}</span></div>
        <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin:12px 0 6px">NEGÓCIOS</div>
        <div class="row"><span>Táxi — resultado acumulado (receitas − custos de operação)</span><span style="color:#7eb8f7">${fKz(taxiIn - taxiOperatingTotal())}</span></div>
        <div class="row"><span>Importação — lucro realizado</span><span style="color:#c084fc">${fKz(importProfitTotal())}</span></div>
        <div class="row"><span>Importação — stock em curso (ao custo)</span><span style="color:#c084fc">${fKz(importStockValue())}</span></div>
        <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin:12px 0 6px">INVESTIMENTOS E APLICAÇÕES</div>

    // ── FINANÇAS PESSOAIS ──────────────────────────────────────────────
    function pagePessoal() {
      const period = window._pessoalPeriod || "month";
      const RP = [{ id: "today", label: "HOJE" }, { id: "week", label: "SEMANA" }, { id: "month", label: "MÊS" }, { id: "year", label: "ANO" }, { id: "all", label: "TUDO" }];
      const incomeP = db.hub_income.filter(x => inPeriod(x.date, period));
      const expenseP = db.hub_expenses.filter(x => inPeriod(x.date, period));

      const income = db.hub_income.reduce((s, x) => s + Number(x.amount || 0), 0);
      const expenses = db.hub_expenses.reduce((s, x) => s + Number(x.amount || 0), 0);

      // Saldos reais, lidos diretamente das contas (fonte única da verdade)
      const cashAccount = db.accounts.find(a => a.name === "Dinheiro em Mãos");
      const cashBalance = cashAccount ? Number(cashAccount.balance || 0) : 0;
      const bankBalance = db.accounts.filter(a => a.type === "pessoal" && a.name !== "Dinheiro em Mãos").reduce((s, a) => s + Number(a.balance || 0), 0);

      // Salário disponível = salário KB + outras entradas − saídas (corrige saldo negativo incorreto)
       const kambioProfitP = db.sales.filter(s => (!s.pendingPayment || s.pendingPaid) && inPeriod(s.date, period)).reduce((s, x) => s + Number(x.totalProfit || 0), 0);
       const salarioKb = kambioProfitP * currentSplit("kambio", periodEndDate(period) || undefined).salary;
       const outrasEntradasP = incomeP.filter(x => x.category !== "Salário").reduce((s, x) => s + Number(x.amount || 0), 0);
       const disponivelP = salarioKb + outrasEntradasP;
       const retiradoP = expenseP.reduce((s, x) => s + Number(x.amount || 0), 0);
       const saldoP = disponivelP - retiradoP;

      // Resumo por categoria + subcategoria (gastos do período)
      const catTotals = {};
      expenseP.forEach(x => {
        const key = x.subcategory ? `${x.category} — ${x.subcategory}` : x.category;
        catTotals[key] = (catTotals[key] || 0) + Number(x.amount || 0);
      });
      const catSorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
      const maxCat = catSorted[0]?.[1] || 1;

      // Gastos de hoje, do menor para o maior
      const todayExpenses = [...db.hub_expenses].filter(x => x.date === today()).sort((a, b) => Number(a.amount) - Number(b.amount));
      const todayTotal = todayExpenses.reduce((s, x) => s + Number(x.amount || 0), 0);

      const accountName = (id) => db.accounts.find(a => String(a.id) === String(id))?.name || null;

      return `
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        ${RP.map(p => `<button class="${period === p.id ? "btn-p" : "btn-ghost"}" style="font-size:11px;padding:6px 14px" onclick="setPessoalPeriod('${p.id}')">${p.label}</button>`).join("")}
      </div>

      <div class="grid4" style="margin-bottom:20px">
        ${sc("Total Entradas", fKz(income), "#50c878", "▲")}
        ${sc("Total Saídas", fKz(expenses), "#ff7850", "▼")}
        ${sc("Em Contas Bancárias", fKz(bankBalance), "#7eb8f7", "🏦")}
        ${sc("Dinheiro em Mãos", fKz(cashBalance), "#c9a84c", "💵")}
      </div>

      ${!cashAccount ? `<div class="card" style="margin-bottom:20px;border-color:#ff785044">
        <div style="font-size:12px;color:#ff7850">⚠ Ainda não existe uma conta "Dinheiro em Mãos" no Kâmbio. Cria-a em Kâmbio → Carteiras → Contas em Kwanzas (tipo Pessoal) para o saldo aparecer aqui corretamente.</div>
      </div>` : ""}

      <div class="card" style="margin-bottom:20px;border-color:${saldoP < 0 ? "#ff585033" : "#50c87833"}">
        <div class="sec-title">💡 Salário Disponível para Saque (${RP.find(p => p.id === period)?.label})</div>
        <div class="grid2">
          <div>
            <div class="row"><span>Lucro Kâmbio no período</span><span style="color:#c9a84c">${fKz(kambioProfitP)}</span></div>
             <div class="row"><span>Salário KB (${Math.round(currentSplit("kambio").salary * 100)}%)</span><span style="color:#50c878;font-weight:700">${fKz(salarioKb)}</span></div>
            <div class="row"><span>Outras entradas (não-salário)</span><span style="color:#7eb8f7;font-weight:700">${fKz(outrasEntradasP)}</span></div>
            <div class="row"><span>Total disponível</span><span style="color:#c9a84c;font-weight:700">${fKz(disponivelP)}</span></div>
            <div class="row"><span>Já sacado (saídas)</span><span style="color:#ff7850;font-weight:700">${fKz(retiradoP)}</span></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center">
            ${saldoP < 0 ? `
            <div style="text-align:center">
              <div style="font-size:10px;color:#ff5050;letter-spacing:2px">⚠ ACIMA DO DISPONÍVEL</div>
              <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#ff5050">${fKz(Math.abs(saldoP))}</div>
              <div style="font-size:10px;color:#666;margin-top:4px">sacaste a mais do que o disponível</div>
            </div>`: `
            <div style="text-align:center">
              <div style="font-size:10px;color:#50c878;letter-spacing:2px">✓ DISPONÍVEL PARA SACAR</div>
              <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#50c878">${fKz(saldoP)}</div>
              <div style="font-size:10px;color:#666;margin-top:4px">saldo de salário por retirar</div>
            </div>`}
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="sec-title">Onde Foi o Dinheiro (${RP.find(p => p.id === period)?.label})</div>
        ${catSorted.length === 0 ? empty("Sem saídas neste período") : catSorted.map(([cat, val]) => `
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span style="color:#ccc">${cat}</span><span style="color:#ff7850;font-weight:700">${fKz(val)}</span>
            </div>
            <div style="background:#1a1a2e;border-radius:2px;height:6px;overflow:hidden">
              <div style="background:linear-gradient(90deg,#ff7850,#c9a84c);width:${(val / maxCat * 100).toFixed(0)}%;height:100%"></div>
            </div>
          </div>`).join("")}
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="sec-title">📋 Gastos de Hoje — do menor ao maior</div>
        ${todayExpenses.length === 0 ? empty("Sem gastos registados hoje") : `
        <table class="tbl">
          <thead><tr><th>Categoria</th><th>Subcategoria</th><th>Conta</th><th>Valor</th></tr></thead>
          <tbody>${todayExpenses.map(x => `<tr>
            <td><span class="cat-badge red">${x.category}</span></td>
            <td style="color:#888">${x.subcategory || "—"}</td>
            <td style="color:#777;font-size:11px">${accountName(x.accountId) || x.method || "—"}</td>
            <td style="color:#ff7850;font-weight:700">${fKz(x.amount)}</td>
          </tr>`).join("")}</tbody>
        </table>
        <div style="text-align:right;margin-top:10px;font-size:12px;color:#888">Total de hoje: <span style="color:#ff7850;font-weight:700">${fKz(todayTotal)}</span></div>`}
      </div>

      <div class="grid2">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div class="sec-title" style="margin:0">Entradas</div>
            <button class="btn-p" onclick="openModal('income')">+ ENTRADA</button>
          </div>
          ${db.hub_income.length === 0 ? empty() : `
          <div style="overflow-x:auto"><table class="tbl">
            <thead><tr><th>Data</th><th>Categoria</th><th>Conta</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
            <tbody>${[...db.hub_income].sort((a, b) => new Date(b.date) - new Date(a.date)).map(x => `
              <tr>
                <td>${fDate(x.date)}</td>
                <td><span class="cat-badge green">${x.category}</span>${x.subcategory ? `<div style="font-size:10px;color:#666;margin-top:2px">${x.subcategory}</div>` : ""}</td>
                <td style="color:#777;font-size:11px">${accountName(x.accountId) || x.method || "—"}</td>
                <td style="color:#aaa">${x.description || "—"}</td>
                <td style="color:#50c878;font-weight:700">${fKz(x.amount)}</td>
                <td><button class="btn-d" onclick="delIncomeEntry('${x.id}')">✕</button></td>
              </tr>`).join("")}
            </tbody>
          </table></div>`}
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div class="sec-title" style="margin:0">Saídas</div>
            <button class="btn-p" onclick="openModal('expense')">+ SAÍDA</button>
          </div>
          ${db.hub_expenses.length === 0 ? empty() : `
          <div style="overflow-x:auto"><table class="tbl">
            <thead><tr><th>Data</th><th>Categoria</th><th>Conta</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
            <tbody>${[...db.hub_expenses].sort((a, b) => new Date(b.date) - new Date(a.date)).map(x => `
              <tr>
                <td>${fDate(x.date)}</td>
                <td><span class="cat-badge red">${x.category}</span>${x.subcategory ? `<div style="font-size:10px;color:#666;margin-top:2px">${x.subcategory}</div>` : ""}</td>
                <td style="color:#777;font-size:11px">${accountName(x.accountId) || x.method || "—"}</td>
                <td style="color:#aaa">${x.description || "—"}</td>
                <td style="color:#ff7850;font-weight:700">${fKz(x.amount)}</td>
                <td><button class="btn-d" onclick="delExpenseEntry('${x.id}')">✕</button></td>
              </tr>`).join("")}
            </tbody>
          </table></div>`}
        </div>
      </div>

      ${modal === "income" ? incomeExpenseModal("income") : ""}
      ${modal === "expense" ? incomeExpenseModal("expense") : ""}`;
    }
    window.setPessoalPeriod = function (p) { window._pessoalPeriod = p; render(); };
    window.setPessoalPeriod = function (p) { window._pessoalPeriod = p; render(); };

    function incomeExpenseModal(kind) {

          <button class="btn-ghost" onclick="closeModal()">CANCELAR</button>
        </div>
      </div></div>`;
    }

    // ── TÁXI ───────────────────────────────────────────────────────────
    function pageTaxi() {
      const entries = [...db.hub_taxi].sort((a, b) => new Date(b.date) - new Date(a.date));
      const costs = [...db.hub_taxi_costs].sort((a, b) => new Date(b.date) - new Date(a.date));
      const totalIn = db.hub_taxi.reduce((s, x) => s + Number(x.amount || 0), 0);
      const totalInvestment = taxiInvestmentTotal();
      const totalOperating = taxiOperatingTotal();
      const liquid = totalIn - totalOperating;
      // breakeven: investimento no carro vs receita acumulada
      const pctBreak = totalInvestment > 0 ? Math.min(100, (totalIn / totalInvestment) * 100).toFixed(1) : 0;
      const carValue = taxiCarValue();

      const COST_CATS = ["Compra do Carro", "Peça/Reparação", "Combustível", "Manutenção Preventiva", "Caixa de Segurança", "Seguro", "Outro"];

      return `
          <div class="grid4" style="margin-bottom:20px">
            ${sc("Receita Total", fKz(totalIn), "#50c878", "▲")}
            ${sc("Custos de Operação", fKz(totalOperating), "#ff7850", "▼")}
            ${sc("Líquido (operação)", fKz(liquid), liquid >= 0 ? "#c9a84c" : "#ff5050", "◆")}
            ${sc("Carro (valor actual)", fKz(carValue), "#c084fc", "⬢")}
          </div>

          <!-- Breakeven visual -->
          <div class="card" style="margin-bottom:20px">
            <div class="sec-title">Breakeven — Recuperação do Investimento no Carro</div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:8px">
              <span>Investido no carro: <span style="color:#ff7850">${fKz(totalInvestment)}</span></span>
              <span>Recuperado: <span style="color:#50c878">${fKz(totalIn)}</span></span>
              <span style="color:${totalIn >= totalInvestment ? "#50c878" : "#ff7850"}">${totalIn >= totalInvestment ? "✅ BREAKEVEN ATINGIDO" : "Faltam " + fKz(Math.abs(totalInvestment - totalIn))}</span>
            </div>
            <div style="background:#1a1a2e;border-radius:4px;height:10px;overflow:hidden">
              <div style="background:linear-gradient(90deg,#ff7850,#c9a84c,#50c878);width:${pctBreak}%;height:100%;transition:width 1s;border-radius:4px"></div>
            </div>
            <div style="font-size:10px;color:#555;margin-top:4px">${pctBreak}% do investimento recuperado</div>
          </div>

          <div class="card" style="margin-bottom:20px">
            <div class="sec-title">🚗 Carro — Activo do Negócio</div>
            <div style="font-size:11px;color:#666;margin-bottom:10px">O carro entra no património como activo, não como dinheiro disponível. Regista o valor estimado actual (custo de aquisição + preparação: ${fKz(totalInvestment)}).</div>

              <input type="number" id="taxi-car-value-input" min="0" step="1000" value="${carValue || ""}" placeholder="ex: 6250000" style="flex:1"/>

          </div>

              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">

              ${entries.length === 0 ? empty("Sem receitas registadas") : `

                  <td>${fDate(x.date)}</td>

                </tr>`).join("")}</tbody>

            <div class="card">

                <button class="btn-p" onclick="openModal('taxi-cost')">+ CUSTO</button>
              </div>
              ${costs.length === 0 ? empty("Sem custos registados") : `
              <div style="overflow-x:auto"><table class="tbl">
                <thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Descrição</th><th></th></tr></thead>
                <tbody>${costs.map(x => `<tr>
                  <td>${fDate(x.date)}</td>

        { id: "amount", label: "Valor (Kz)", type: "number", placeholder: "ex: 50000" },
        { id: "description", label: "Descrição", type: "text", placeholder: "ex: Compra pneus dianteiros" },

    }

    window.calcImport = function () {
      const priceUSD = parseFloat(document.getElementById("m-price_usd")?.value || 0);
      const freightUS = parseFloat(document.getElementById("m-freight_us")?.value || 0);
      const freightAO = parseFloat(document.getElementById("m-freight_ao")?.value || 0);
      const rateUSDT = parseFloat(document.getElementById("m-rate_usdt_usd")?.value || 1.01454545);
      const rateKz = parseFloat(document.getElementById("m-rate_kz")?.value || 1157);
      const marketing = parseFloat(document.getElementById("m-marketing")?.value || 0);
      const packaging = parseFloat(document.getElementById("m-packaging")?.value || 0);
      const saleKz = parseFloat(document.getElementById("m-sale_kz")?.value || 0);
      const cashbackType = document.getElementById("m-cashback_type")?.value || "percentage";
      const cashbackInput = parseFloat(document.getElementById("m-cashback_value")?.value || 0);

      const agt = priceUSD * 0.16;
      const totalUSD = priceUSD + freightUS + freightAO + agt;
      const totalUSDT = totalUSD * rateUSDT;
      const totalKzBruto = totalUSDT * rateKz + marketing + packaging;
      const cashbackKz = cashbackType === "percentage" ? totalKzBruto * (cashbackInput / 100)
        : cashbackType === "usdt" ? cashbackInput * rateKz
          : cashbackInput;
      const totalKz = totalKzBruto - cashbackKz;
      const profit = saleKz - totalKz;

      const el = id => document.getElementById(id);
      if (el("calc-agt")) el("calc-agt").textContent = fUSD(agt);
      if (el("calc-total-usd")) el("calc-total-usd").textContent = fUSD(totalUSD);
      if (el("calc-cashback")) el("calc-cashback").textContent = fKz(cashbackKz);
      if (el("calc-total-kz")) el("calc-total-kz").textContent = fKz(totalKz);
      if (el("calc-profit")) { el("calc-profit").textContent = fKz(profit); el("calc-profit").style.color = profit >= 0 ? "#50c878" : "#ff5050"; }

      window._importCalc = { priceUSD, freightUS, freightAO, rateUSDT, rateKz, marketing, packaging, saleKz, agt, totalUSD, totalUSDT, totalKzBruto, cashbackType, cashbackInput, cashbackKz, totalKz, profit };
    };

    window.saveImport = async function () {
      const product = document.getElementById("m-product")?.value?.trim();
      const orderDate = document.getElementById("m-orderDate")?.value;
      const status = document.getElementById("m-status")?.value;
      const statusDate = document.getElementById("m-statusDate")?.value || today();
      const notes = document.getElementById("m-notes")?.value || "";
      const card = document.getElementById("m-card")?.value?.trim() || "";
      const platform = document.getElementById("m-platform")?.value?.trim() || "";
      const storeName = document.getElementById("m-storeName")?.value?.trim() || "";
      const condition = document.getElementById("m-condition")?.value || "";
      const purchaseType = document.getElementById("m-purchaseType")?.value || "";
      if (!product) return alert("Nome do produto obrigatório.");
      calcImport();
      const c = window._importCalc || {};

      const editing = modalState?.editId ? db.hub_imports.find(i => String(i.id) === String(modalState.editId)) : null;
      const id = modalState?.editId || uid();

      let statusHistory;
      if (!editing) {
        statusHistory = [{ id: uid(), status, date: orderDate }];
      } else if (status !== editing.status) {
        statusHistory = [...(editing.statusHistory || []), { id: uid(), status, date: statusDate }];
      } else {
        statusHistory = editing.statusHistory || [];
      }

      await saveDoc("hub_imports", {
        id, product, orderDate, status, notes, card, platform, storeName, condition, purchaseType, statusHistory,
        priceUSD: c.priceUSD, freightUS: c.freightUS, freightAO: c.freightAO,
        agtUSD: c.agt, totalUSD: c.totalUSD, totalCostKz: c.totalKz,
        saleKz: c.saleKz, profitKz: c.profit,
        rateUsdtUsd: c.rateUSDT, rateKz: c.rateKz,
        marketing: c.marketing, packaging: c.packaging,
        cashbackType: c.cashbackType, cashbackValue: c.cashbackInput, cashbackKz: c.cashbackKz,
      });
      modal = null; render();
    };

    // ── HELPERS DE TEMPO (IMPORTAÇÃO) ───────────────────────────────────
    function daysBetween(d1, d2) {
      if (!d1 || !d2) return null;
      return Math.round((new Date(d2) - new Date(d1)) / (1000 * 60 * 60 * 24));
    }
    function importStatusDate(imp, status) {
      const entry = [...(imp.statusHistory || [])].reverse().find(h => h.status === status);
      return entry?.date || null;
    }

    // ── CUSTÓDIA ───────────────────────────────────────────────────────
    function custodyWithdrawn(item) { return (item.withdrawals || []).reduce((s, w) => s + Number(w.amount || 0), 0); }
    function custodyRemaining(item) { return Number(item.amount || 0) - custodyWithdrawn(item); }
    function custodyOriginLabel(item) {
      if (item.sourceType === "account") return db.accounts.find(a => String(a.id) === String(item.sourceId))?.name || item.account || "—";
      if (item.sourceType === "wallet") { const w = db.wallets.find(x => String(x.id) === String(item.sourceId)); return w ? `${w.name} (${w.asset || "USDT"})` : item.account || "—"; }
      return item.account || "—";
    }
    function custodySourceOptions() {
      const accountOptions = db.accounts.map(a => `<option value="account:${a.id}" ${a.type === "pessoal" ? "data-pessoal=\"1\"" : ""}>Conta Kz — ${a.name} (${fKz(a.balance)})</option>`).join("");
      const walletOptions = db.wallets.map(w => `<option value="wallet:${w.id}">Carteira — ${w.name} (${w.asset || "USDT"})</option>`).join("");
      return `<optgroup label="Contas em Kz">${accountOptions}</optgroup><optgroup label="Carteiras cripto">${walletOptions}</optgroup>`;
    }
    function custodySourceReductions(sourceType, sourceId, amount) {
      const updates = [];
      if (sourceType === "account") {
        const account = db.accounts.find(a => String(a.id) === String(sourceId));
        if (account) updates.push({ col: "accounts", item: { ...account, balance: Number(account.balance || 0) - amount } });
      } else if (sourceType === "wallet") {
        let remaining = amount;
        const lots = db.lots.filter(l => String(l.walletId) === String(sourceId) && Number(l.remaining || 0) > 0).sort((a, b) => new Date(a.date) - new Date(b.date));
        for (const lot of lots) {
          if (remaining <= 0) break;
          const deduct = Math.min(Number(lot.remaining || 0), remaining);
          updates.push({ col: "lots", item: { ...lot, remaining: Number(lot.remaining) - deduct } });
          remaining -= deduct;
        }
        if (remaining > 0.0000001) return null;
      }
      return updates;
    }

    function pageCustodia() {
      const active = db.hub_custody.filter(x => !x.returned); const returned = db.hub_custody.filter(x => x.returned);
      const totalAtivo = active.reduce((s, x) => s + Number(x.amount || 0), 0);

      return `

        ${sc("Em Custódia (ativo)", fKz(totalAtivo), "#ff7850", "🔒")}
        ${sc("Nº de Pessoas", active.length, "#7eb8f7", "◉")}
        ${sc("Já Devolvido", fKz(returned.reduce((s, x) => s + Number(x.amount || 0), 0)), "#50c878", "✓")}
        ${sc("Total Recebido", fKz(db.hub_custody.reduce((s, x) => s + Number(x.amount || 0), 0)), "#c9a84c", "◈")}
      </div>

      <div style="background:rgba(255,120,80,0.05);border:1px solid rgba(255,120,80,0.2);border-radius:2px;padding:14px;margin-bottom:20px;font-size:12px;color:#888;line-height:1.8">
        ⚠️ O dinheiro em custódia <strong style="color:#ff7850">não é teu</strong> — está contabilizado nas tuas contas mas excluído do cálculo do teu património real.
        Quando usas dinheiro de custódia para investir no negócio, regista um movimento de saída aqui.
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">

          <button class="btn-p" onclick="openModal('custody')">+ REGISTAR</button>
        </div>
        ${active.length === 0 ? empty("Nenhum depósito em custódia activo.") : `
        <div style="overflow-x:auto"><table class="tbl">
          <thead><tr><th>Pessoa</th><th>Total</th><th>Devolvido</th><th>Restante</th><th>Data</th><th>Conta</th><th>Notas</th><th></th></tr></thead>
          <tbody>${active.map(x => {
        const withdrawn = custodyWithdrawn(x), remaining = custodyRemaining(x);
        return `<tr>
            <td style="font-weight:700;color:#e8e4d9">${x.person}</td>
            <td style="color:#ff7850">${fKz(x.amount)}</td>
            <td style="color:#50c878">${fKz(withdrawn)}</td>
            <td style="font-weight:700;color:${remaining <= 0 ? "#50c878" : "#c9a84c"}">${fKz(remaining)}</td>
            <td>${fDate(x.date)}</td>
            <td style="color:#777">${x.account || "—"}</td>
            <td style="color:#555;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.notes || "—"}</td>
            <td style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn-ghost" style="padding:4px 9px;font-size:11px;color:#ff7850;border-color:#ff785044" onclick="openModal('custody-withdraw','${x.id}')">💸</button>
              <button class="btn-d" style="color:#50c878;border-color:#50c87844" onclick="markReturned('${x.id}')">✓</button>
              <button class="btn-d" onclick="del('hub_custody','${x.id}')">✕</button>

    // ── INTELIGÊNCIA FINANCEIRA ─────────────────────────────────────────
    function pageInsights() {
      const now = new Date();
      const period = "month";
      const kambioProfit = db.sales.filter(s => (!s.pendingPayment || s.pendingPaid) && inPeriod(s.date, period)).reduce((s, x) => s + Number(x.totalProfit || 0), 0);
      const taxiIn = db.hub_taxi.filter(x => inPeriod(x.date, period)).reduce((s, x) => s + Number(x.amount || 0), 0);
      const taxiCost = db.hub_taxi_costs.filter(x => !isTaxiInvestment(x) && inPeriod(x.date, period)).reduce((s, x) => s + Number(x.amount || 0), 0);
      const taxiProfit = taxiIn - taxiCost;
      const importProfit = db.hub_imports.filter(i => i.status === "vendido" && inPeriod(i.orderDate, period)).reduce((s, i) => s + Number(i.profitKz || 0), 0);

      const pendingSales = db.sales.filter(s => s.pendingPayment && !s.pendingPaid);
      const overdueLoans = db.hub_loans.filter(l => !l.returned && l.dueDate && new Date(l.dueDate) < now);
      const overdueObligations = (db.hub_obligations || []).filter(x => (!x.status || x.status === "Em dívida") && x.dueDate && new Date(x.dueDate) < now);
      const maturingDeposits = (db.hub_deposits || []).filter(x => (!x.status || x.status === "Em aplicação") && x.maturityDate && Math.round((new Date(x.maturityDate) - now) / 86400000) <= 15);

      const stockByAsset = {};
      db.lots.filter(l => Number(l.remaining || 0) > 0).forEach(l => { const a = l.asset || "USDT"; stockByAsset[a] = (stockByAsset[a] || 0) + Number(l.remaining || 0); });
      const stockMin = Number((db.settings || []).find(s => s.id === "stock-minimum")?.value || 0);
      const lowStock = Object.entries(stockByAsset).filter(([, v]) => stockMin > 0 && v < stockMin);

      const walletValue = {};
      db.wallets.forEach(w => { const asset = w.asset || "USDT"; const stock = db.lots.filter(l => String(l.walletId) === String(w.id) && Number(l.remaining || 0) > 0).reduce((t, l) => t + Number(l.remaining || 0), 0); walletValue[w.id] = stock * avgBuyRate(asset); });
      const totalWallet = Object.values(walletValue).reduce((s, v) => s + v, 0);
      const topWallet = db.wallets.map(w => ({ name: w.name, value: walletValue[w.id] || 0 })).sort((a, b) => b.value - a.value)[0];

    window.saveLoanPayment = async function (loanId) {
      const date = document.getElementById("lp-date")?.value;
      const amount = parseFloat(document.getElementById("lp-amount")?.value) || 0;
      const accountId = document.getElementById("lp-account")?.value || null;
      if (!amount) return alert("Valor obrigatório.");
      const loan = db.hub_loans.find(l => String(l.id) === String(loanId));
      if (!loan) return;
      const payments = [...(loan.payments || []), { id: uid(), date, amount, accountId }];
      const totalPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
      const autoReturned = totalPaid >= Number(loan.amount || 0);
      const updates = [{ col: "hub_loans", item: { ...loan, payments, returned: autoReturned } }];
      if (accountId) {
        const account = db.accounts.find(a => String(a.id) === String(accountId));
        if (account) updates.push({ col: "accounts", item: { ...account, balance: Number(account.balance) + amount } });
      }
      await bulkSave(updates);
      modal = null; render();
    };

    window.markLoanReturned = async function (id) {
      if (!confirm("Marcar como devolvido?")) return;
      const item = db.hub_loans.find(x => x.id === id);
      if (item) await saveDoc("hub_loans", { ...item, returned: true });
    };

    window.saveSalePayment = async function (saleId) {
      const accountId = document.getElementById("sp-account")?.value;
      if (!accountId) return alert("Escolhe a conta que recebeu o pagamento.");
      const sale = db.sales.find(s => String(s.id) === String(saleId));
      if (!sale) return;
      const account = db.accounts.find(a => String(a.id) === String(accountId));
      if (!account) return;
      await saveDoc("accounts", { ...account, balance: Number(account.balance) + pendingSaleAmount(sale) });
      await saveDoc("sales", { ...sale, pendingPaid: true, accountId: String(accountId) });
      modal = null; render();
    };

    window.saveModal_obligation = async function () {
      const creditor = document.getElementById("m-creditor")?.value?.trim();
      const amount = parseFloat(document.getElementById("m-amount")?.value || 0);
      if (!creditor || amount <= 0) return alert("Credor e valor obrigatórios.");
      const editing = modalState?.editId ? (db.hub_obligations || []).find(x => String(x.id) === String(modalState.editId)) : null;
      await saveDoc("hub_obligations", {
        id: editing?.id || uid(), creditor, amount,
        date: document.getElementById("m-date")?.value || today(),
        dueDate: document.getElementById("m-dueDate")?.value || "",
        status: document.getElementById("m-status")?.value || "Em dívida",
        notes: document.getElementById("m-notes")?.value || "",
      });
      modal = null; render();
    };

    window.saveModal_loan = async function () {
      const person = document.getElementById("m-person")?.value?.trim();
      const asset = document.getElementById("m-loan-asset")?.value || "Kz";
      const amount = parseFloat(document.getElementById("m-amount")?.value) || 0;
      const date = document.getElementById("m-date")?.value;
      const dueDate = document.getElementById("m-dueDate")?.value;
      const notes = document.getElementById("m-notes")?.value || "";
      if (!person || !amount) return alert("Nome e valor obrigatórios.");

      const editing = modalState?.editId ? db.hub_loans.find(l => String(l.id) === String(modalState.editId)) : null;
      const id = modalState?.editId || uid();
      let lotId = editing?.lotId || null, walletId = editing?.walletId || null;
      let accountId = editing?.accountId || null;

      if (asset !== "Kz" && !editing) {
        lotId = document.getElementById("m-loan-lot")?.value;
        const lot = db.lots.find(l => String(l.id) === String(lotId));
        if (!lot) return alert("Escolhe o lote de origem.");
        if (amount > Number(lot.remaining)) return alert("Quantidade superior ao stock disponível no lote.");
        walletId = lot.walletId;
        const wallet = db.wallets.find(w => String(w.id) === String(walletId));
        await bulkSave([
          { col: "lots", item: { ...lot, remaining: Number(lot.remaining) - amount } },
          { col: "wallets", item: { ...wallet, balance: Math.max(0, Number(wallet.balance) - amount) } },
        ]);
      }

      if (asset === "Kz" && !editing) {
        accountId = document.getElementById("m-loan-account")?.value;
        if (!accountId) return alert("Escolhe a conta de onde saiu o dinheiro.");
        const account = db.accounts.find(a => String(a.id) === String(accountId));
        if (!account) return alert("Conta inválida.");
        if (amount > Number(account.balance)) return alert("Saldo insuficiente nessa conta.");
        await saveDoc("accounts", { ...account, balance: Number(account.balance) - amount });
      }

      await saveDoc("hub_loans", {
        id, person, amount, asset, lotId, walletId, accountId, date, dueDate, notes,
        returned: editing?.returned || false, payments: editing?.payments || []
      });
      modal = null; window._loanAsset = null; render();
    };
    window.markReturned = async function (id) {
      const item = db.hub_custody.find(x => x.id === id);
      if (!item) return;
      const remaining = custodyRemaining(item);
      if (!confirm(`Confirmar devolução total de ${fKz(remaining)} a ${item.person}?`)) return;
      if (remaining > 0 && item.sourceType) {
        const reductions = custodySourceReductions(item.sourceType, item.sourceId, remaining);
        if (!reductions) return alert("Saldo insuficiente na origem para devolver totalmente.");
        await bulkSave([...reductions, { col: "hub_custody", item: { ...item, returned: true } }]);
      } else {
        await saveDoc("hub_custody", { ...item, returned: true });
      }
    };

    window.saveCustodyWithdrawal = async function (id) {
      const date = document.getElementById("cw-date")?.value;
      const amount = parseFloat(document.getElementById("cw-amount")?.value) || 0;
      if (!amount) return alert("Valor obrigatório.");
      const item = db.hub_custody.find(x => String(x.id) === String(id));
      if (!item) return;
      if (amount > custodyRemaining(item)) return alert("Valor superior ao que ainda está em custódia.");
      const sourceValue = document.getElementById("cw-source")?.value || `${item.sourceType || ""}:${item.sourceId || ""}`.replace(/^:/, "");
      if (!sourceValue || !sourceValue.includes(":")) return alert("Escolhe a origem da devolução.");
      const [sourceType, sourceId] = sourceValue.split(":");
      const reductions = custodySourceReductions(sourceType, sourceId, amount);
      if (!reductions) return alert("Saldo insuficiente na origem selecionada.");
      if (!confirm(`Confirmar devolução de ${fKz(amount)} a ${item.person}?`)) return;
      const withdrawals = [...(item.withdrawals || []), { id: uid(), date, amount, sourceType, sourceId }];
      const totalWithdrawn = withdrawals.reduce((s, w) => s + Number(w.amount || 0), 0);
      const autoReturned = totalWithdrawn >= Number(item.amount || 0);
      await bulkSave([...reductions, { col: "hub_custody", item: { ...item, withdrawals, returned: autoReturned } }]);
      modal = null; render();
    };

    function pageCalculadora() {

          </div>
        </div>

        <div id="calc-result" style="background:#0b0b14;border:1px solid #1c1c2e;border-radius:2px;padding:20px">

        </div>

    window.runCalc = function () {
      const rateUSD = parseFloat(document.getElementById("c-rate-usd")?.value || 1.01454545);
      const rateKz = parseFloat(document.getElementById("c-rate-kz")?.value || 1157);
      const freightUS = parseFloat(document.getElementById("c-freight-us")?.value || 0);
      const freightAO = parseFloat(document.getElementById("c-freight-ao")?.value || 0);
      const marketing = parseFloat(document.getElementById("c-marketing")?.value || 0);
      const packaging = parseFloat(document.getElementById("c-packaging")?.value || 0);
      const saleKz = parseFloat(document.getElementById("c-sale")?.value || 0);
      const profitKz = parseFloat(document.getElementById("c-profit")?.value || 0);

      if (!saleKz && !profitKz) return;

      // max cost in Kz = sale - desired profit
      const maxCostKz = saleKz - profitKz;
      // subtract marketing and packaging
      const maxCostUSDT = (maxCostKz - marketing - packaging) / rateKz;
      const maxCostUSD = maxCostUSDT / rateUSD;
      // subtract frights and AGT from total USD to get max product price
      // total = priceUSD + priceUSD*0.16 + freightUS + freightAO
      // total = priceUSD*1.16 + freights
      const maxProductUSD = (maxCostUSD - freightUS - freightAO) / 1.16;
      const agtUSD = maxProductUSD * 0.16;

      const el = document.getElementById("calc-result");
      if (!el) return;

      if (maxProductUSD <= 0) {
        el.innerHTML = `<div style="text-align:center;color:#ff5050;font-size:12px">❌ Com estes valores não é possível obter lucro. Aumenta o preço de venda ou reduz o lucro desejado.</div>`;
        return;
      }

      el.innerHTML = `
  <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin-bottom:14px">RESULTADO</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    <div style="background:#111;border:1px solid #1a1a2e;padding:12px;border-radius:2px;text-align:center">
      <div style="font-size:10px;color:#555;letter-spacing:1px;margin-bottom:6px">PREÇO MÁXIMO NO EBAY</div>
      <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#50c878">${fUSD(maxProductUSD)}</div>
    </div>
    <div style="background:#111;border:1px solid #1a1a2e;padding:12px;border-radius:2px;text-align:center">
      <div style="font-size:10px;color:#555;letter-spacing:1px;margin-bottom:6px">CUSTO TOTAL EM KZ</div>
      <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#ff7850">${fKz(maxCostKz)}</div>
    </div>
  </div>
  <div style="font-size:11px;color:#666;line-height:2">
    <div style="display:flex;justify-content:space-between"><span>Produto (máximo):</span><span style="color:#e8e4d9">${fUSD(maxProductUSD)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>AGT (16% do produto):</span><span style="color:#ff7850">${fUSD(agtUSD)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Frete eBay → Redirecionadora:</span><span>${fUSD(freightUS)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Frete → Angola:</span><span>${fUSD(freightAO)}</span></div>
    <div style="display:flex;justify-content:space-between;border-top:1px solid #1a1a2e;margin-top:6px;padding-top:6px"><span>Total USD:</span><span style="color:#7eb8f7">${fUSD(maxProductUSD + agtUSD + freightUS + freightAO)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Tráfego + Embalagem:</span><span style="color:#ff7850">${fKz(marketing + packaging)}</span></div>
    <div style="display:flex;justify-content:space-between;border-top:1px solid #1a1a2e;margin-top:6px;padding-top:6px;font-weight:700"><span>Lucro:</span><span style="color:#50c878">${fKz(profitKz || saleKz - maxCostKz)}</span></div>
  </div>`;
    };

    // ══════════════════════════════════════════════════════════════════
    //  UI HELPERS

    function sc(label, value, color, icon) {
      return `<div class="stat-card">

    function periodEndDate(p) {
      const now = new Date();
      if (p === "today" || p === "week") return today();
      if (p === "month") return new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().slice(0, 10);
      if (p === "year") return `${now.getFullYear()}-12-31`;
      return "";
    }
    function splitBox(label, amount, accent, business = "global", dateStr = "") {
      const split = currentSplit(business, dateStr || undefined);
      const reinvest = amount * split.reinvest, salary = amount * split.salary, savings = amount * split.savings;
      return `<div class="card">
    <div class="sec-title">${label}</div>
    <div style="font-size:11px;color:#666;margin-bottom:12px">Lucro do período: <span style="color:${accent};font-weight:700">${fKz(amount)}</span></div>
    <div class="bud-box" style="border-color:#7eb8f7"><div class="bud-label">REINVESTIR (${Math.round(split.reinvest * 100)}%)</div><div class="bud-val" style="color:#7eb8f7;font-size:16px">${fKz(reinvest)}</div></div>
    <div class="bud-box" style="border-color:#50c878"><div class="bud-label">SALÁRIO (${Math.round(split.salary * 100)}%)</div><div class="bud-val" style="color:#50c878;font-size:16px">${fKz(salary)}</div></div>
    <div class="bud-box" style="border-color:#c9a84c"><div class="bud-label">POUPANÇA (${Math.round(split.savings * 100)}%)</div><div class="bud-val" style="color:#c9a84c;font-size:16px">${fKz(savings)}</div></div>
  </div>`;

    function empty(txt = "Sem registos") {
      return `<div style="text-align:center;padding:30px 0;color:#444;font-size:12px;letter-spacing:2px">${txt.toUpperCase()}</div>`;
    }

    function gv(id) { return document.getElementById("m-" + id)?.value || ""; }

    function modalForm(title, type, fields, onSave) {
      return `<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">${title}</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      ${fields.map(f => `<div class="field">
        <label>${f.label}</label>
        ${f.type === "select"
          ? `<select id="m-${f.id}">${f.opts.map(o => `<option>${o}</option>`).join("")}</select>`
          : `<input type="${f.type}" id="m-${f.id}" placeholder="${f.placeholder || ""}" value="${f.val || ""}" ${f.type === "number" ? "step='0.01'" : ""}/>`
        }
      </div>`).join("")}

    <div style="display:flex;gap:12px;margin-top:20px">

    function openModal(t, editId = null) { modal = t; modalState = { editId }; render(); }
    function closeModal() { modal = null; render(); }
    window.openModal = openModal; window.closeModal = closeModal;

    async function del(col, id) { if (confirm("Eliminar?")) await delDoc(col, id); }
    window.del = del;

    function attachAll() {
      setStatus("online");
      // dynamically bind save functions for modal forms
      window.saveModal_income = window.saveModal_income || (() => { });
      window.saveModal_expense = window.saveModal_expense || (() => { });
      window.saveModal_taxi_in = window.saveModal_taxi_in || (() => { });
      window.saveModal_taxi_cost = window.saveModal_taxi_cost || (() => { });
      window.saveModal_custody = window.saveModal_custody || (() => { });
      if (modal === "import") calcImport();
      if (modal === "custody") { const source = document.getElementById("m-source"); if (source && source.options.length === 0) source.innerHTML = custodySourceOptions(); }
    }

    // Bind modal saves dynamically since they're closures in page functions
    // We re-render pages and rebind via onclick strings calling global async functions
    window.saveIncomeExpense = async function (kind) {
      const isIncome = kind === "income";
      const col = isIncome ? "hub_income" : "hub_expenses";
      const date = document.getElementById("m-date")?.value;
      const category = document.getElementById("m-category")?.value;
      const subcategory = document.getElementById("m-subcategory")?.value?.trim() || "";
      const accountId = document.getElementById("m-accountId")?.value;
      const amount = parseFloat(document.getElementById("m-amount")?.value) || 0;
      const description = document.getElementById("m-description")?.value || "";
      if (!category || !amount) return alert("Preenche categoria e valor.");
      if (!accountId) return alert("Escolhe a conta de onde o dinheiro entrou/saiu.");

      const account = db.accounts.find(a => String(a.id) === String(accountId));
      if (!account) return alert("Conta inválida.");
      if (!isIncome && amount > Number(account.balance || 0)) return alert(`Saldo insuficiente em ${account.name}. Saldo actual: ${fKz(account.balance)}.`);

      const newBalance = isIncome ? Number(account.balance) + amount : Number(account.balance) - amount;
      await saveDoc("accounts", { ...account, balance: newBalance });
      await saveDoc(col, { id: uid(), date, category, subcategory, accountId: String(accountId), amount, description });
      modal = null; render();
    };

    window.previewMovement = function () {
      const preview = document.getElementById("movement-preview");
      const account = db.accounts.find(a => String(a.id) === String(document.getElementById("m-accountId")?.value));
      const amount = Number(document.getElementById("m-amount")?.value || 0);
      if (!preview || !account || !amount) return;
      const isIncome = window._movementKind === "income";
      const balance = Number(account.balance || 0);
      const after = isIncome ? balance + amount : balance - amount;
      preview.innerHTML = `${isIncome ? "Saldo depois da entrada" : "Saldo depois da saída"}: <strong style="color:${after >= 0 ? "#50c878" : "#ff5050"}">${fKz(after)}</strong><br><span style="color:#555">Saldo actual: ${fKz(balance)} · ${account.name}</span>`;
    };

    window.delIncomeEntry = async function (id) {
      if (!confirm("Eliminar esta entrada? O valor será removido do saldo da conta.")) return;
      const entry = db.hub_income.find(x => String(x.id) === String(id));
      if (entry?.accountId) {
        const account = db.accounts.find(a => String(a.id) === String(entry.accountId));
        if (account) await saveDoc("accounts", { ...account, balance: Number(account.balance) - Number(entry.amount) });
      }
      await delDoc("hub_income", id);
    };

    window.delExpenseEntry = async function (id) {
      if (!confirm("Eliminar esta saída? O valor será devolvido ao saldo da conta.")) return;
      const entry = db.hub_expenses.find(x => String(x.id) === String(id));
      if (entry?.accountId) {
        const account = db.accounts.find(a => String(a.id) === String(entry.accountId));
        if (account) await saveDoc("accounts", { ...account, balance: Number(account.balance) + Number(entry.amount) });
      }
      await delDoc("hub_expenses", id);
    };

    window.saveModal_taxi_in = async function () {
      const d = gv("date"), t = gv("type"), a = parseFloat(gv("amount") || 0), n = gv("notes");
      if (!a) return alert("Valor obrigatório.");
      await saveDoc("hub_taxi", { id: uid(), date: d, type: t, amount: a, notes: n });
      modal = null; render();
    };

    window.saveModal_taxi_cost = async function () {
      const d = gv("date"), c = gv("category"), a = parseFloat(gv("amount") || 0), desc = gv("description");
      if (!a || !c) return alert("Categoria e valor obrigatórios.");
      await saveDoc("hub_taxi_costs", { id: uid(), date: d, category: c, amount: a, description: desc });
      modal = null; render();
    };

    window.saveModal_custody = async function () {
      const person = gv("person"), amount = parseFloat(gv("amount") || 0), date = gv("date"), notes = gv("notes");
      const source = gv("source");
      if (!person || !amount) return alert("Nome e valor obrigatórios.");
      if (!source) return alert("Escolhe a origem onde o dinheiro ficou guardado.");
      const [sourceType, sourceId] = source.split(":");
      const isWallet = sourceType === "wallet";
      const wallet = isWallet ? db.wallets.find(w => String(w.id) === String(sourceId)) : null;
      const account = !isWallet ? db.accounts.find(a => String(a.id) === String(sourceId)) : null;
      const label = isWallet ? `${wallet?.name || "?"} (${wallet?.asset || "USDT"})` : account?.name || "?";
      await saveDoc("hub_custody", { id: uid(), person, amount, date, account: label, sourceType, sourceId, asset: isWallet ? (wallet?.asset || "USDT") : "Kz", notes, returned: false, usedInBusiness: false });
      modal = null; render();
    };

    window.saveHubNotes = async function () {
      const text = document.getElementById("hub-notes-text")?.value || "";
      await saveDoc("hub_notes", { id: "main", text, updatedAt: new Date().toISOString(), origin: "hub" });
      alert("✅ Notas guardadas!");
    };
    window.saveBusinessSplits = async function () {
      const businesses = ["global", "kambio", "taxi", "importacao"];
      const splits = {};
      const historyEntries = [];
      for (const business of businesses) {
        const values = ["reinvest", "salary", "savings"].map(key => Number(document.getElementById(`split-${business}-${key}`)?.value || 0));
        if (values.some(value => value < 0 || value > 100) || Math.abs(values.reduce((sum, value) => sum + value, 0) - 100) > 0.001) return alert(`A divisão de ${business} deve somar exactamente 100%.`);
        const next = { reinvest: values[0] / 100, salary: values[1] / 100, savings: values[2] / 100 };
        const previous = currentSplit(business);
        splits[business] = next;
        if (Math.abs(next.reinvest - previous.reinvest) > 0.000001 || Math.abs(next.salary - previous.salary) > 0.000001 || Math.abs(next.savings - previous.savings) > 0.000001) {
          historyEntries.push({ business, reinvest: next.reinvest, salary: next.salary, savings: next.savings, effectiveFrom: today(), changedAt: new Date().toISOString() });
        }
      }
      if (!confirm("Confirmar alteração das divisões de lucro? As mudanças valem para o futuro e as operações antigas mantêm a divisão da época.")) return;
      const existingHistory = db.settings?.find(item => item.id === "profit-split-history")?.history || [];
      await bulkSave([
        { col: "settings", item: { id: "profit-splits", ...splits, updatedAt: new Date().toISOString() } },
        { col: "settings", item: { id: "profit-split-history", history: [...existingHistory, ...historyEntries] } },
      ]);
      alert("✅ Divisões por negócio guardadas com histórico.");
    };

    initAppAndAuth();
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  </script>

      position: relative;
      overflow: hidden
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #c9a84c44, transparent)
    }

    .sec-title {
      font-size: 11px;
      color: #c9a84c;
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-transform: uppercase
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #111;
      font-size: 12px;
      color: #666
    }

    .row.bold {
      color: #aaa;
      font-weight: 700
    }

    .btn-p {
      background: #c9a84c;
      color: #08080f;
      border: none;
      padding: 8px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all .15s;
      border-radius: 2px
    }

    .btn-p:hover {
      background: #dab85c
    }

    .btn-ghost {
      background: transparent;
      color: #c9a84c;
      border: 1px solid #c9a84c44;
      padding: 8px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      border-radius: 2px
    }

    .btn-ghost:hover {
      border-color: #c9a84c;
      background: rgba(201, 168, 76, .06)
    }

    .btn-d {
      background: transparent;
      color: #e55;
      border: 1px solid #e5555544;
      padding: 4px 9px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
      border-radius: 2px
    }

    .btn-d:hover {
      background: #e55;
      color: #fff
    }

    input,
    select,
    textarea {
      background: #0b0b14;
      border: 1px solid #1e1e30;
      color: #e8e4d9;
      padding: 9px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      width: 100%;
      outline: none;
      transition: border .15s;
      border-radius: 2px
    }

    input:focus,
    select:focus {
      border-color: #c9a84c55
    }

    select option {
      background: #0b0b14
    }

    label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #555;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase
    }

    .field {
      display: flex;
      flex-direction: column
    }

    .field.full {
      grid-column: 1/-1
    }

    .computed {
      background: #0b0b14;
      border: 1px solid #1e1e30;
      padding: 9px 12px;
      color: #c9a84c;
      font-weight: 700;
      font-size: 14px;
      border-radius: 2px
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px
    }

    .tbl th {
      text-align: left;
      padding: 9px 10px;
      color: #c9a84c;
      font-size: 9px;
      letter-spacing: 2px;
      border-bottom: 1px solid #1a1a2e;
      text-transform: uppercase
    }

    .tbl td {
      padding: 9px 10px;
      border-bottom: 1px solid #111;
      color: #aaa
    }

    .tbl tr:hover td {
      background: rgba(201, 168, 76, .02)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px
    }

    .bud-box {
      background: #0b0b14;
      border: 1px solid #1c1c2e;
      border-radius: 2px;
      padding: 14px;
      margin-bottom: 10px
    }

    .bud-label {
      font-size: 10px;
      color: #555;
      letter-spacing: 2px;
      margin-bottom: 6px
    }

    .bud-val {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Syne', sans-serif
    }

    .cat-badge {
      display: inline-block;
      padding: 2px 7px;
      font-size: 10px;
      border-radius: 2px;
      letter-spacing: 1px
    }

    .cat-badge.green {
      background: rgba(80, 200, 120, .1);
      color: #50c878
    }

    .cat-badge.red {
      background: rgba(255, 120, 80, .1);
      color: #ff7850
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .modal {
      background: #0f0f1a;
      border: 1px solid #c9a84c22;
      border-top: 2px solid #c9a84c;
      padding: 26px;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 2px
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #c9a84c;
      margin-bottom: 20px
    }

    .ham {
      display: none;
      background: none;
      border: 1px solid #c9a84c44;
      color: #c9a84c;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 15px;
      border-radius: 2px
    }

    .veil {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 49
    }

    .veil.show {
      display: block
    }

    @media(max-width:900px) {
      .grid4 {
        grid-template-columns: 1fr 1fr !important
      }

      .grid2 {
        grid-template-columns: 1fr !important
      }

      .grid3 {
        grid-template-columns: 1fr !important
      }
    }

    @media(max-width:640px) {
      .sidebar {
        position: fixed;
        left: -204px;
        top: 0;
        bottom: 0;
        transition: left .25s
      }

      .sidebar.open {
        left: 0
      }

      .ham {
        display: block
      }

      .grid4 {
        grid-template-columns: 1fr 1fr !important
      }

      .body {
        padding: 16px
      }
    }

    @media(max-width:640px) {
      .modal { width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow-y: auto; padding: 18px; }
      .tbl { min-width: 700px; }
      .card { max-width: 100%; }
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%
    }

    .login-card {
      background: #0f0f1a;
      border: 1px solid #c9a84c22;
      border-top: 2px solid #c9a84c;
      padding: 32px;
      width: 100%;
      max-width: 340px;
      border-radius: 2px
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .field input, .field select, .field textarea { width: 100%; box-sizing: border-box; }
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
