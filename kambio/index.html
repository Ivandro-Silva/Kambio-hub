<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kâmbio Business PRO</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, enableIndexedDbPersistence }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ══════════════════════════════════════════════════════════════════
    //  🔧 CONFIGURAÇÃO FIREBASE — substitui pelos teus valores
    //  (ver guia abaixo)
    // ══════════════════════════════════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyD_dc1z0cLy0cqrtQhy52AuRnFosCtKANQ",
      authDomain: "kambio-business.firebaseapp.com",
      projectId: "kambio-business",
      storageBucket: "kambio-business.firebasestorage.app",
      messagingSenderId: "830662712719",
      appId: "1:830662712719:web:abc695b03a706217ebbffa"
    };
    // ══════════════════════════════════════════════════════════════════

    const COLLECTIONS = ["lots", "sales", "clients", "affiliates", "suppliers", "accounts", "wallets", "transfers"];
    const DEFAULT_WALLETS = ["RedotPay", "Binance", "Bybit", "Kast", "Grey"];
    const DEFAULT_ACCOUNTS = ["BFA", "BAI", "Multicaixa Express (Avó/Irmãos)", "PayPay"];

    let app, db_fire;
    let db = { lots: [], sales: [], clients: [], affiliates: [], suppliers: [], accounts: [], wallets: [], transfers: [] };
    let unsubscribers = [];

    // ── LOCAL FALLBACK (quando Firebase não está configurado) ──────────
    const LOCAL_KEY = "kambio_pro_local";
    const isConfigured = () => !firebaseConfig.apiKey.includes("COLE_AQUI");

    function localLoad() {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || db; } catch { return db; }
    }
    function localSave() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
    }

    // ── FIREBASE INIT ──────────────────────────────────────────────────
    async function initFirebase() {
      if (!isConfigured()) {
        console.warn("Firebase não configurado — usando localStorage.");
        db = localLoad();
        seedDefaults();
        render();
        setStatus("offline-local");
        return;
      }
      try {
        app = initializeApp(firebaseConfig);
        db_fire = getFirestore(app);
        await enableIndexedDbPersistence(db_fire).catch(() => { });
        setStatus("connecting");
        COLLECTIONS.forEach(col => {
          const unsub = onSnapshot(collection(db_fire, col), snap => {
            db[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            seedDefaults();
            render();
            setStatus("online");
          }, () => { setStatus("offline"); });
          unsubscribers.push(unsub);
        });
      } catch (e) {
        console.error(e);
        db = localLoad();
        seedDefaults();
        render();
        setStatus("error");
      }
    }

    // ── CRUD ───────────────────────────────────────────────────────────
    async function saveDoc(col, item) {
      const id = item.id ? String(item.id) : String(Date.now());
      const data = { ...item, id };
      if (!isConfigured()) {
        db[col] = [...db[col].filter(x => String(x.id) !== id), data];
        localSave(); render(); return id;
      }
      await setDoc(doc(db_fire, col, id), data);
      return id;
    }

    async function delDoc(col, id) {
      if (!isConfigured()) {
        db[col] = db[col].filter(x => String(x.id) !== String(id));
        localSave(); render(); return;
      }
      await deleteDoc(doc(db_fire, col, String(id)));
    }

    async function bulkSave(updates) {
      // updates: [{col, item}]
      for (const u of updates) await saveDoc(u.col, u.item);
    }

    // ── SEED DEFAULTS ──────────────────────────────────────────────────
    let seeded = false;

    async function seedDefaults() {
      if (seeded) return;
      if (db.wallets.length === 0) {
        for (const [i, n] of DEFAULT_WALLETS.entries())
          await saveDoc("wallets", { id: i + 1, name: n, balance: 0, asset: "USDT" });
      }
      if (db.accounts.length === 0) {
        for (const [i, n] of DEFAULT_ACCOUNTS.entries())
          await saveDoc("accounts", { id: i + 1, name: n, balance: 0 });
      }
      seeded = true;
    }

    // ── STATUS INDICATOR ───────────────────────────────────────────────
    function setStatus(s) {
      const el = document.getElementById("sync-status");
      if (!el) return;
      const map = {
        online: ["🟢", "SINCRONIZADO", "#50c878"],
        offline: ["🟡", "OFFLINE (dados locais)", "#c9a84c"],
        connecting: ["🔵", "A LIGAR...", "#7eb8f7"],
        "offline-local": ["⚪", "LOCAL (sem Firebase)", "#888"],
        error: ["🔴", "ERRO DE LIGAÇÃO", "#ff5050"],
      };
      const [icon, label, color] = map[s] || map.error;
      el.innerHTML = `<span style="font-size:9px;letter-spacing:1px;color:${color}">${icon} ${label}</span>`;
    }

    // ══════════════════════════════════════════════════════════════════
    //  UI STATE
    // ══════════════════════════════════════════════════════════════════
    let currentPage = "dashboard";
    let modalState = null; // {type, data}

    function hubLink() {
      if (location.protocol === "file:" || location.hostname === "localhost") {
        return "../hub/index.html";
      }
      return "https://grupo-kambio-hub.web.app";
    }

    const fKz = v => `${Number(v || 0).toLocaleString("pt-AO", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Kz`;
    const fU = v => `${Number(v || 0).toFixed(4)} USDT`;
    const FIAT_ASSETS = ["EUR", "USD", "GBP"];
    const fAsset = (v, asset = "USDT") => `${Number(v || 0).toFixed(FIAT_ASSETS.includes(asset) ? 2 : 4)} ${asset}`;
    const fDate = d => d ? new Date(d).toLocaleDateString("pt-AO") : "—";
    const today = () => new Date().toISOString().split("T")[0];
    const uid = () => Date.now();

    const PAGES = [
      { id: "dashboard", "label": "Dashboard", icon: "▣" },
      { id: "buy", "label": "Comprar", icon: "↓" },
      { id: "sell", "label": "Vender", icon: "↑" },
      { id: "stock", "label": "Stock", icon: "◈" },
      { id: "clients", "label": "Clientes", icon: "◉" },
      { id: "ranking", "label": "Ranking", icon: "★" },
      { id: "affiliates", "label": "Afiliados", icon: "◎" },
      { id: "wallets", "label": "Carteiras", icon: "◆" },
      { id: "transfers", "label": "Transferências", icon: "⇄" },
      { id: "financial", "label": "Financeiro", icon: "⊕" },
      { id: "settings", "label": "Definições", icon: "⚙" },
    ];

    // ── RENDER LOOP ────────────────────────────────────────────────────
    function render() {
      const app = document.getElementById("app");
      if (!app) return;
      app.innerHTML = buildLayout();
      attachEvents();
    }

    function buildLayout() {
      return `
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-name">KÂMBIO</span>
          <span class="brand-sub">BUSINESS · PRO</span>
        </div>
        <nav>
          ${PAGES.map(p => `
            <button class="nav${currentPage === p.id ? " act" : ""}" onclick="navigate('${p.id}')">
              <span style="font-size:15px;width:20px;flex-shrink:0">${p.icon}</span>
              <span>${p.label}</span>
            </button>`).join("")}
        </nav>
        <div class="quick-bal">
          <div style="color:#555;letter-spacing:2px;margin-bottom:8px;font-size:10px">SALDO RÁPIDO</div>
          ${(() => { const t = {}; db.wallets.forEach(w => { const a = w.asset || "USDT"; t[a] = (t[a] || 0) + walletBalance(w.id); }); return Object.entries(t).map(([a, v]) => `<div class="qrow"><span>${a}</span><span style="color:#7eb8f7;font-weight:700">${fAsset(v, a)}</span></div>`).join(""); })()}
          <div class="qrow"><span>Kz Total</span><span style="color:#c9a84c;font-weight:700">${fKz(db.accounts.reduce((s, a) => s + Number(a.balance || 0), 0))}</span></div>
          <div id="sync-status" style="margin-top:8px"></div>
        </div>
      </aside>
      <div class="veil" id="veil" onclick="closeMenu()"></div>
      <div class="main">
        <header class="header">
          <button class="ham" onclick="toggleMenu()">☰</button>
          <div>
            <div class="page-title">${PAGES.find(p => p.id === currentPage)?.label || ""}</div>
            <div class="page-date">${new Date().toLocaleDateString("pt-AO", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
          </div>
          <a href="${hubLink()}" style="margin-left:auto;font-size:10px;color:#c9a84c;text-decoration:none;letter-spacing:1px;border:1px solid #c9a84c33;padding:6px 12px;border-radius:2px">← HUB</a>
        </header>

        <div class="body">
          ${buildPage()}
        </div>
      </div>`;
    }

    function navigate(p) { currentPage = p; closeMenu(); render(); }
    function toggleMenu() {
      document.getElementById("sidebar")?.classList.toggle("open");
      document.getElementById("veil")?.classList.toggle("show");
    }
    function closeMenu() {
      document.getElementById("sidebar")?.classList.remove("open");
      document.getElementById("veil")?.classList.remove("show");
    }
    window.navigate = navigate;
    window.toggleMenu = toggleMenu;
    window.closeMenu = closeMenu;

    // ══════════════════════════════════════════════════════════════════
    //  PAGES
    // ══════════════════════════════════════════════════════════════════
    function buildPage() {
      switch (currentPage) {
        case "dashboard": return pageDashboard();
        case "buy": return pageBuy();
        case "sell": return pageSell();
        case "stock": return pageStock();
        case "clients": return pageClients();
        case "ranking": return pageRanking();
        case "affiliates": return pageAffiliates();
        case "wallets": return pageWallets();
        case "transfers": return pageTransfers();
        case "financial": return pageFinancial();
        case "settings": return pageSettings();
        default: return "";
      }
    }

    // ── DASHBOARD ──────────────────────────────────────────────────────
    function pageDashboard() {
      const now = new Date();
      const todayStr = today();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const todayP = db.sales.filter(s => s.date === todayStr).reduce((s, x) => s + Number(x.totalProfit || 0), 0);
      const monthP = db.sales.filter(s => new Date(s.date) >= monthStart).reduce((s, x) => s + Number(x.totalProfit || 0), 0);
      const totalP = db.sales.reduce((s, x) => s + Number(x.totalProfit || 0), 0);
      const stockByAsset = {}; db.lots.filter(l => Number(l.remaining || 0) > 0).forEach(l => { const a = l.asset || "USDT"; stockByAsset[a] = (stockByAsset[a] || 0) + Number(l.remaining || 0); });
      const stockStr = Object.entries(stockByAsset).map(([a, v]) => fAsset(v, a)).join(" · ") || "0";
      const recent = [...db.sales].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
      const topC = topClientMonth();
      const suggest = monthP * 0.30;

      return `
  <div class="grid4" style="margin-bottom:20px">
    ${statCard("Lucro Hoje", fKz(todayP), todayP >= 0 ? "#50c878" : "#ff5050", "▲")}
    ${statCard("Lucro do Mês", fKz(monthP), "#c9a84c", "◆")}
    ${statCard("Lucro Total", fKz(totalP), "#c9a84c", "★")}
    ${statCard("Stock Disponível", stockStr, "#7eb8f7", "◈")}
  </div>
  <div class="grid2" style="margin-bottom:20px">
    <div class="card">
      <div class="sec-title">Carteiras (Multi-Ativo)</div>
      ${db.wallets.map(w => `<div class="row"><span>${w.name} <span style="color:#444">(${w.asset || "USDT"})</span></span><span style="color:#7eb8f7;font-weight:700">${fAsset(walletBalance(w.id), w.asset || "USDT")}</span></div>`).join("")}
      <div style="border-top:1px solid #1a1a2e;margin-top:8px;padding-top:8px">
        ${(() => { const t = {}; db.wallets.forEach(w => { const a = w.asset || "USDT"; t[a] = (t[a] || 0) + walletBalance(w.id); }); return Object.entries(t).map(([a, v]) => `<div class="row bold"><span>TOTAL ${a}</span><span style="color:#7eb8f7">${fAsset(v, a)}</span></div>`).join(""); })()}
      </div>
    </div>
    <div class="card">
      <div class="sec-title">Contas em Kwanzas</div>
      ${db.accounts.map(a => `<div class="row"><span>${a.name}</span><span style="color:#c9a84c;font-weight:700">${fKz(a.balance)}</span></div>`).join("")}
      <div style="border-top:1px solid #1a1a2e;margin-top:8px;padding-top:8px">
        <div class="row bold"><span>TOTAL</span><span style="color:#c9a84c">${fKz(db.accounts.reduce((s, a) => s + Number(a.balance || 0), 0))}</span></div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="sec-title">Últimas Vendas</div>
      ${recent.length === 0 ? '<div class="empty">SEM VENDAS</div>' : `
      <table class="tbl"><thead><tr><th>Data</th><th>USDT</th><th>Câmbio</th><th>Lucro</th></tr></thead><tbody>
      ${recent.map(s => `<tr>
        <td>${fDate(s.date)}</td>
        <td style="color:#7eb8f7">${fU(s.totalUsdt)}</td>
        <td style="color:#c9a84c">${Number(s.rateKz).toLocaleString()} Kz</td>
        <td style="color:${Number(s.totalProfit) >= 0 ? "#50c878" : "#ff5050"};font-weight:700">${fKz(s.totalProfit)}</td>
      </tr>`).join("")}
      </tbody></table>`}
    </div>
    <div class="card">
      <div class="sec-title">💡 Dica Financeira</div>
      <div style="font-size:12px;color:#888;margin-bottom:12px">Lucro deste mês: <span style="color:#c9a84c;font-weight:700">${fKz(monthP)}</span></div>
      <div class="budget-box blue"><div class="budget-label">REINVESTIR (60%)</div><div class="budget-val" style="color:#7eb8f7">${fKz(monthP * 0.6)}</div></div>
      <div class="budget-box green"><div class="budget-label">SALÁRIO (30%)</div><div class="budget-val" style="color:#50c878">${fKz(suggest)}</div></div>
      <div class="budget-box gold"><div class="budget-label">POUPANÇA (10%)</div><div class="budget-val" style="color:#c9a84c">${fKz(monthP * 0.1)}</div></div>      ${topC ? `<div class="top-client-box">
        <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin-bottom:4px">★ CLIENTE DO MÊS</div>
        <div style="font-weight:700;color:#e8e4d9">${topC.name}</div>
        <div style="font-size:11px;color:#777">${fU(topC.volume)} comprados este mês</div>
      </div>`: ""}
    </div>
  </div>`;
    }

    // ── BUY PAGE ───────────────────────────────────────────────────────
    function pageBuy() {
      const lots = [...db.lots].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)).slice(0, 12);
      return `
  <div class="grid2">
    <div class="card">
      <div class="sec-title">Registar Compra de USDT</div>
      <div class="form-grid">
        <div class="field"><label>Data *</label><input type="date" id="b-date" value="${today()}"/></div>
        <div class="field"><label>Fornecedor</label>
          <select id="b-sup" onchange="onSupChange()">
            <option value="">— Seleccionar —</option>
            ${db.suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join("")}
            <option value="__new">+ Novo fornecedor...</option>
          </select>
        </div>
        <div class="field" id="b-supname-wrap" style="display:none"><label>Nome do Fornecedor *</label><input type="text" id="b-supname" placeholder="ex: João Silva"/></div>
        <div class="field"><label>Ativo *</label>
          <input list="asset-options-buy" id="b-asset" value="USDT" oninput="onAssetChangeBuy()"/>
          <datalist id="asset-options-buy"><option value="USDT"></option><option value="USDC"></option><option value="EUR"></option><option value="USD"></option></datalist>
        </div>
        <div class="field"><label>Quantidade <span id="b-asset-label">USDT</span> *</label><input type="number" id="b-usdt" placeholder="ex: 500" oninput="calcBuyTotal()"/></div>
        <div class="field"><label>Câmbio de Compra (Kz/<span id="b-asset-label2">USDT</span>) *</label><input type="number" id="b-rate" placeholder="ex: 1130" oninput="calcBuyTotal()"/></div>        <div class="field"><label>Total a Pagar</label><div class="computed" id="b-total">0,00 Kz</div></div>
        <div class="field"><label>Carteira de Destino *</label>
          <select id="b-wallet">
            <option value="">— Seleccionar —</option>
            ${db.wallets.map(w => `<option value="${w.id}">${w.name} · ${w.asset || "USDT"} (${fAsset(walletBalance(w.id), w.asset || "USDT")})</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Conta de Pagamento (Kz) *</label>
          <select id="b-account">
            <option value="">— Seleccionar —</option>
            ${db.accounts.map(a => `<option value="${a.id}">${a.name} (${fKz(a.balance)})</option>`).join("")}
          </select>
        </div>
        <div class="field full"><label>Notas</label><input type="text" id="b-notes" placeholder="Opcional..."/></div>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:16px" onclick="submitBuy()">REGISTAR COMPRA</button>
    </div>
    <div class="card">
      <div class="sec-title">Lotes Recentes</div>
      ${lots.length === 0 ? '<div class="empty">SEM LOTES</div>' : `
      <div style="overflow-x:auto"><table class="tbl">
       <thead><tr><th>Data</th><th>Fornecedor</th><th>Ativo</th><th>Qtd</th><th>Câmbio</th><th>Restante</th><th>Carteira</th></tr></thead>
        <tbody>${lots.map(l => {
        const w = db.wallets.find(x => String(x.id) === String(l.walletId));
        const asset = l.asset || "USDT";
        return `<tr>
            <td>${fDate(l.date)}</td>
            <td style="font-weight:700">${l.supplierName || "—"}</td>
            <td style="color:#c084fc">${asset}</td>
            <td style="color:#7eb8f7">${fAsset(l.usdt, asset)}</td>
            <td style="color:#c9a84c">${Number(l.rateKz).toLocaleString()} Kz</td>
            <td style="color:${Number(l.remaining) > 0 ? "#50c878" : "#555"}">${fAsset(l.remaining, asset)}</td>
            <td style="color:#777">${w?.name || "—"}</td>
          </tr>`;
      }).join("")}</tbody>
      </table></div>`}
    </div>
  </div>`;
    }

    window.onSupChange = function () {
      const v = document.getElementById("b-sup")?.value;
      const wrap = document.getElementById("b-supname-wrap");
      if (wrap) wrap.style.display = v === "__new" ? "block" : "none";
    };
    window.onAssetChangeBuy = function () {
      const a = document.getElementById("b-asset")?.value?.trim() || "USDT";
      if (document.getElementById("b-asset-label")) document.getElementById("b-asset-label").textContent = a;
      if (document.getElementById("b-asset-label2")) document.getElementById("b-asset-label2").textContent = a;
    };
    window.calcBuyTotal = function () {
      const u = parseFloat(document.getElementById("b-usdt")?.value) || 0;
      const r = parseFloat(document.getElementById("b-rate")?.value) || 0;
      const el = document.getElementById("b-total");
      if (el) el.textContent = fKz(u * r);
    };
    window.submitBuy = async function () {
      const date = document.getElementById("b-date")?.value;
      const asset = document.getElementById("b-asset")?.value?.trim() || "USDT";
      const supId = document.getElementById("b-sup")?.value;
      const supName = supId === "__new"
        ? document.getElementById("b-supname")?.value?.trim()
        : (db.suppliers.find(s => String(s.id) === supId)?.name || "Fornecedor");
      const usdt = parseFloat(document.getElementById("b-usdt")?.value) || 0;
      const rate = parseFloat(document.getElementById("b-rate")?.value) || 0;
      const walletId = document.getElementById("b-wallet")?.value;
      const accountId = document.getElementById("b-account")?.value;
      const notes = document.getElementById("b-notes")?.value || "";

      if (!usdt || !rate || !walletId || !accountId || !supName) return alert("Preenche todos os campos obrigatórios.");

      const lot = {
        id: uid(), date, supplierName: supName, asset,
        usdt, rateKz: rate, totalKz: usdt * rate,
        walletId: String(walletId), remaining: usdt,
        notes, createdAt: new Date().toISOString(),
      };

      // save new supplier if new
      if (supId === "__new" && supName) await saveDoc("suppliers", { id: uid(), name: supName, phone: "" });

      const wallet = db.wallets.find(w => String(w.id) === String(walletId));
      const account = db.accounts.find(a => String(a.id) === String(accountId));

      await bulkSave([
        { col: "lots", item: lot },
        { col: "wallets", item: { ...wallet, balance: Number(wallet.balance) + usdt } },
        { col: "accounts", item: { ...account, balance: Number(account.balance) - (usdt * rate) } },
      ]);
      alert("✅ Compra registada! Lote criado.");
      navigate("stock");
    };

    // ── SELL PAGE ──────────────────────────────────────────────────────
    let sellLots = []; // [{uid, lotId, usdt}]
    let clientSearch = "";
    let sellAsset = "USDT";

    function pageSell() {
      const availLots = db.lots.filter(l => Number(l.remaining || 0) > 0 && (l.asset || "USDT") === sellAsset).sort((a, b) => new Date(a.date) - new Date(b.date));
      const rate = parseFloat(document.getElementById("s-rate")?.value) || 0;
      let totalUsdt = 0, totalRevenue = 0, totalProfit = 0;
      const breakdown = sellLots.map(entry => {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        if (!lot || !entry.usdt) return null;
        const u = Number(entry.usdt);
        const profit = u * (rate - Number(lot.rateKz));
        totalUsdt += u; totalRevenue += u * rate; totalProfit += profit;
        return { lot, u, profit };
      }).filter(Boolean);

      return `
  <div class="grid2">
    <div class="card">
      <div class="sec-title">Registar Venda de USDT</div>
      <div class="form-grid">
        <div class="field"><label>Data *</label><input type="date" id="s-date" value="${today()}"/></div>
        <div class="field"><label>Ativo a Vender *</label>
          <select id="s-asset" onchange="onSellAssetChange(this.value)">

    function buildSellSummary(rate, totalUsdt, totalRevenue, totalProfit, breakdown) {
      return `
      <div class="card" style="margin-bottom:16px">

          <div class="row bold"><span>LUCRO TOTAL</span><span style="color:${totalProfit >= 0 ? "#50c878" : "#ff5050"};font-size:15px">${fKz(totalProfit)}</span></div>
        </div>
      </div>
      ${breakdown.length > 0 ? `
      <div class="card">
        <div class="sec-title">Lucro por Lote</div>
        ${breakdown.map(b => `
        <div class="lot-entry">
          <div style="font-size:11px;color:#888;margin-bottom:4px">${b.lot.supplierName} · comprado a ${Number(b.lot.rateKz).toLocaleString()} Kz</div>
          <div style="display:flex;justify-content:space-between">
            <span style="color:#7eb8f7">${fU(b.u)}</span>
            <span style="font-weight:700;color:${b.profit >= 0 ? "#50c878" : "#ff5050"}">${fKz(b.profit)}</span>
          </div>
          <div style="font-size:10px;color:#555;margin-top:2px">Spread: ${fKz(rate - Number(b.lot.rateKz))} / USDT</div>
        </div>`).join("")}
      </div>`: ""}`;
    }

    window.addSellLot = function () { sellLots.push({ uid: uid(), lotId: "", usdt: "" }); render(); };
    window.removeSellLot = function (u) { sellLots = sellLots.filter(l => String(l.uid) !== String(u)); render(); };
    window.updateSellLot = function (u, k, v) { sellLots = sellLots.map(l => String(l.uid) === String(u) ? { ...l, [k]: v } : l); render(); };
    window.refreshSell = function () {
      const rate = parseFloat(document.getElementById("s-rate")?.value) || 0;
      let totalUsdt = 0, totalRevenue = 0, totalProfit = 0;
      const breakdown = sellLots.map(entry => {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        if (!lot || !entry.usdt) return null;
        const u = Number(entry.usdt);
        const profit = u * (rate - Number(lot.rateKz));
        totalUsdt += u; totalRevenue += u * rate; totalProfit += profit;
        return { lot, u, profit };
      }).filter(Boolean);
      const wrap = document.getElementById("sell-summary-wrap");
      if (wrap) wrap.innerHTML = buildSellSummary(rate, totalUsdt, totalRevenue, totalProfit, breakdown);
    };
    window.onSellAssetChange = function (v) { sellAsset = v; sellLots = []; render(); };

    window.submitSell = async function () {
      const date = document.getElementById("s-date")?.value;
      const rateKz = parseFloat(document.getElementById("s-rate")?.value) || 0;
      const clientId = document.getElementById("s-client")?.value || null;
      const affId = document.getElementById("s-aff")?.value || null;
      const accountId = document.getElementById("s-account")?.value;
      const notes = document.getElementById("s-notes")?.value || "";

      if (!rateKz || !accountId) return alert("Câmbio de venda e conta de recebimento são obrigatórios.");
      if (!sellLots.length || sellLots.some(l => !l.lotId || !l.usdt)) return alert("Adiciona pelo menos um lote com quantidade.");

      for (const entry of sellLots) {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        if (!lot || Number(entry.usdt) > Number(lot.remaining)) return alert(`Stock insuficiente no lote de ${lot?.supplierName || "?"}.`);
      }

      let totalUsdt = 0, totalRevenue = 0, totalProfit = 0;
      const lotEntries = sellLots.map(entry => {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        const u = Number(entry.usdt); const profit = u * (rateKz - Number(lot.rateKz));
        totalUsdt += u; totalRevenue += u * rateKz; totalProfit += profit;
        return { lotId: String(lot.id), usdt: u, buyRate: lot.rateKz, profit };
      });

      const sale = {
        id: uid(), date, createdAt: new Date().toISOString(),
        clientId: clientId || null, affiliateId: affId || null,
        rateKz, totalUsdt, totalRevenue, totalProfit, lotEntries, asset: sellAsset,
        accountId: String(accountId), notes,
      };

      const updates = [{ col: "sales", item: sale }];

      // deduct lots and wallets
      for (const entry of sellLots) {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        const newRem = Math.max(0, Number(lot.remaining) - Number(entry.usdt));
        updates.push({ col: "lots", item: { ...lot, remaining: newRem } });
        const wallet = db.wallets.find(w => String(w.id) === String(lot.walletId));
        if (wallet) updates.push({ col: "wallets", item: { ...wallet, balance: Math.max(0, Number(wallet.balance) - Number(entry.usdt)) } });
      }

      // credit account
      const account = db.accounts.find(a => String(a.id) === String(accountId));
      updates.push({ col: "accounts", item: { ...account, balance: Number(account.balance) + totalRevenue } });

      await bulkSave(updates);
      sellLots = [];
      alert("✅ Venda registada com sucesso!");
      navigate("financial");
    };

    // ── RANKING ────────────────────────────────────────────────────────
    let rankPeriod = "month";
    function pageRanking() {
      const now = new Date();
      const PERIODS = [{ id: "today", "label": "HOJE" }, { id: "week", "label": "SEMANA" }, { id: "month", "label": "MÊS" }, { id: "year", "label": "ANO" }, { id: "all", "label": "TUDO" }];
      const filter = d => {
        const dt = new Date(d);
        if (rankPeriod === "today") return d === today();
        if (rankPeriod === "week") { const ws = new Date(now); ws.setDate(now.getDate() - now.getDay()); return dt >= ws; }
        if (rankPeriod === "month") return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
        if (rankPeriod === "year") return dt.getFullYear() === now.getFullYear();
        return true;
      };
      const sales = db.sales.filter(s => s.clientId && filter(s.date));
      const grp = {};
      sales.forEach(s => { if (!grp[s.clientId]) grp[s.clientId] = { vol: 0, cnt: 0, prf: 0 }; grp[s.clientId].vol += Number(s.totalUsdt || 0); grp[s.clientId].cnt++; grp[s.clientId].prf += Number(s.totalProfit || 0); });
      const ranked = Object.entries(grp).map(([id, st]) => ({ ...st, client: db.clients.find(c => String(c.id) === String(id)) })).filter(r => r.client).sort((a, b) => b.vol - a.vol);

      return `

    ${PERIODS.map(p => `<button class="${rankPeriod === p.id ? "btn-primary" : "btn-ghost"}" style="font-size:11px;padding:7px 14px" onclick="setRankPeriod('${p.id}')">${p.label}</button>`).join("")}
  </div>

    <div class="sec-title">★ Ranking — ${PERIODS.find(p => p.id === rankPeriod)?.label}</div>

    <table class="tbl"><thead><tr><th>#</th><th>Cliente</th><th>Compras</th><th>Volume USDT</th><th>Lucro Gerado</th><th></th></tr></thead>
    <tbody>${ranked.map((r, i) => `<tr>
      <td style="font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:${i === 0 ? "#FFD700" : i === 1 ? "#C0C0C0" : i === 2 ? "#CD7F32" : "#444"}">${i + 1}</td>
      <td style="font-weight:700;color:#e8e4d9">${r.client.name}</td>
      <td style="color:#c9a84c">${r.cnt}x</td>
      <td style="color:#7eb8f7;font-weight:700">${fU(r.vol)}</td>
      <td style="color:#50c878">${fKz(r.prf)}</td>
      <td>${i === 0 ? '<span class="badge gold">🏆 TOP</span>' : i === 1 ? '<span class="badge silver">🥈 VIP</span>' : i === 2 ? '<span class="badge bronze">🥉 FIEL</span>' : ""}</td>
    </tr>`).join("")}</tbody></table>`}
  </div>`;

    window.submitTransfer = async function () {
      const date = document.getElementById("tr-date")?.value;
      const fromId = document.getElementById("tr-from")?.value;
      const toId = document.getElementById("tr-to")?.value;
      const fee = parseFloat(document.getElementById("tr-fee")?.value) || 0;
      const notes = document.getElementById("tr-notes")?.value || "";

      if (!fromId || !toId) return alert("Escolhe a carteira de origem e destino.");
      if (fromId === toId) return alert("A carteira de origem e destino não podem ser iguais.");
      if (!transferLots.length || transferLots.some(e => !e.lotId || !e.qty)) return alert("Adiciona pelo menos um lote com quantidade.");

      const fromWallet = db.wallets.find(w => String(w.id) === String(fromId));
      const toWallet = db.wallets.find(w => String(w.id) === String(toId));
      if (!fromWallet || !toWallet) return alert("Carteira inválida.");
      if ((fromWallet.asset || "USDT") !== (toWallet.asset || "USDT")) return alert("As carteiras devem ter o mesmo ativo.");

      for (const entry of transferLots) {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        if (!lot || Number(entry.qty) > Number(lot.remaining)) return alert(`Quantidade superior ao stock do lote de ${lot?.supplierName || "?"}.`);
      }

      const totalQty = transferLots.reduce((s, e) => s + Number(e.qty), 0);
      const received = totalQty - fee;
      if (received <= 0) return alert("A taxa não pode ser maior ou igual à quantidade transferida.");
      const asset = fromWallet.asset || "USDT";
      const feeRatio = received / totalQty; // proporção que efetivamente chega ao destino

      const updates = [];
      for (const entry of transferLots) {
        const lot = db.lots.find(l => String(l.id) === String(entry.lotId));
        const qty = Number(entry.qty);
        const newRemaining = Math.max(0, Number(lot.remaining) - qty);
        updates.push({ col: "lots", item: { ...lot, remaining: newRemaining } });
        // novo lote na carteira de destino, com o mesmo câmbio de compra, ajustado pela taxa proporcional
        updates.push({
          col: "lots", item: {
            id: uid() + Math.floor(Math.random() * 1000), date, supplierName: lot.supplierName + " (transferido)",
            usdt: qty * feeRatio, rateKz: lot.rateKz, totalKz: qty * feeRatio * lot.rateKz,
            walletId: String(toId), remaining: qty * feeRatio, asset,
            notes: `Transferido de ${fromWallet.name}`, createdAt: new Date().toISOString(),
          }
        });
      }

      const transfer = { id: uid(), date, fromId: String(fromId), toId: String(toId), amount: totalQty, fee, received, asset, notes, createdAt: new Date().toISOString() };
      updates.push({ col: "transfers", item: transfer });

      transferLots = [];
      alert("✅ Transferência registada! O stock foi movido para a carteira de destino.");

    function pageSettings() {
      return `
  <div class="grid2">
    <div class="card">
      <div class="sec-title">Fornecedores Frequentes</div>
      ${db.suppliers.length === 0 ? '<div style="font-size:12px;color:#444;margin-bottom:12px">Sem fornecedores. Adiciona para seleccionar rapidamente ao comprar.</div>' : `
      <table class="tbl" style="margin-bottom:12px">
        <thead><tr><th>Nome</th><th>Telefone</th><th></th></tr></thead>
        <tbody>${db.suppliers.map(s => `<tr>
          <td style="font-weight:700">${s.name}</td>
          <td style="color:#777">${s.phone || "—"}</td>
          <td style="display:flex;gap:4px">
            <button class="btn-ghost" style="padding:4px 9px;font-size:11px" onclick="editSup('${s.id}')">✎</button>
            <button class="btn-danger" onclick="delSup('${s.id}')">✕</button>
          </td>
        </tr>`).join("")}</tbody>
      </table>`}
      <input type="hidden" id="ns-editid" value=""/>
      <div style="display:flex;gap:8px">
        <input id="ns-name" placeholder="Nome" style="flex:1"/>
        <input id="ns-phone" placeholder="Telefone" style="width:130px"/>
        <button class="btn-ghost" id="ns-submit" onclick="addSup()">+</button>
      </div>
    </div>
    <div class="card">
      <div class="sec-title">Dados & Backup</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="btn-primary" onclick="exportData()">⬇ EXPORTAR BACKUP JSON</button>
        <label class="btn-ghost" style="text-align:center;cursor:pointer;padding:8px 16px;font-size:12px">
          ⬆ IMPORTAR BACKUP
          <input type="file" accept=".json" onchange="importData(event)" style="display:none"/>
        </label>
        <div style="border-top:1px solid #1a1a2e;padding-top:12px">
          <button class="btn-danger" style="width:100%;padding:10px" onclick="resetData()">⚠ APAGAR TODOS OS DADOS</button>
        </div>
      </div>
      <div style="margin-top:16px;padding:12px;background:#0b0b14;border:1px solid #1c1c2e;border-radius:2px">
        <div style="font-size:10px;color:#c9a84c;letter-spacing:2px;margin-bottom:6px">ESTADO FIREBASE</div>
        <div id="sync-status-2"></div>
        ${!isConfigured() ? `<div style="font-size:11px;color:#888;margin-top:6px">Configure o Firebase no ficheiro HTML para sincronização entre dispositivos.</div>` : ""}
      </div>
    </div>
  </div>`;
    }
    window.delSup = async (id) => { if (confirm("Eliminar?")) await delDoc("suppliers", id); };
    window.addSup = async () => {
      const editId = document.getElementById("ns-editid")?.value;
      const n = document.getElementById("ns-name")?.value?.trim();
      if (!n) return;
      await saveDoc("suppliers", { id: editId || uid(), name: n, phone: document.getElementById("ns-phone")?.value || "" });
      document.getElementById("ns-editid").value = "";
      document.getElementById("ns-name").value = "";
      document.getElementById("ns-phone").value = "";
      document.getElementById("ns-submit").textContent = "+";
    };
    window.editSup = (id) => {
      const s = db.suppliers.find(x => String(x.id) === String(id));
      if (!s) return;
      document.getElementById("ns-editid").value = s.id;
      document.getElementById("ns-name").value = s.name;
      document.getElementById("ns-phone").value = s.phone || "";
      document.getElementById("ns-submit").textContent = "✓ ATUALIZAR";
    }; window.exportData = () => {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `kambio_backup_${today()}.json`; a.click();
    };
    window.importData = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        try {
          const d = JSON.parse(ev.target.result);
          if (!confirm("Substituir todos os dados actuais?")) return;
          for (const col of COLLECTIONS) {
            if (d[col]) { for (const item of d[col]) await saveDoc(col, item); }
          }
          alert("✅ Dados importados!"); render();
        } catch { alert("Ficheiro inválido."); }
      }; r.readAsText(f);
    };
    window.resetData = async () => {
      if (!confirm("⚠️ Apagar TUDO? Esta acção é irreversível.")) return;
      for (const col of COLLECTIONS) for (const item of [...db[col]]) await delDoc(col, item.id);
      localStorage.removeItem(LOCAL_KEY);
      seeded = false;
      alert("Dados apagados."); render();
    };

    window.resetCollection = async function (col, label) {
      if (!confirm(`⚠️ Apagar todos os dados de "${label}"? Esta ação é irreversível.`)) return;
      for (const item of [...db[col]]) await delDoc(col, item.id);
      alert(`✅ Dados de "${label}" apagados.`);
      render();
    };

    // ══════════════════════════════════════════════════════════════════
    //  HELPERS
    // ══════════════════════════════════════════════════════════════════
    function topClientMonth() {
      const now = new Date();
      const ms = db.sales.filter(s => { const d = new Date(s.date); return s.clientId && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
      const g = {}; ms.forEach(s => { g[s.clientId] = (g[s.clientId] || 0) + Number(s.totalUsdt || 0); });
      const top = Object.entries(g).sort((a, b) => b[1] - a[1])[0];
      if (!top) return null;
      return { ...db.clients.find(c => String(c.id) === String(top[0])), volume: top[1] };
    }

    function walletStock(walletId) {
      return db.lots.filter(l => String(l.walletId) === String(walletId) && Number(l.remaining || 0) > 0);
    }
    function walletBalance(walletId) {
      return walletStock(walletId).reduce((s, l) => s + Number(l.remaining || 0), 0);
    }

    function statCard(label, value, color, icon) {
      return `
      <div class="stat-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase">${label}</div>
            <div style="font-size:16px;font-weight:700;color:${color};font-family:'Syne',sans-serif">${value}</div>
          </div>
          <div style="color:${color};font-size:18px;opacity:.3">${icon}</div>
        </div>
      </div>`;
    }
    function attachEvents() { setStatus(isConfigured() ? "connecting" : "offline-local"); }

    // ── BOOT ───────────────────────────────────────────────────────────
    initFirebase();
  </script>
